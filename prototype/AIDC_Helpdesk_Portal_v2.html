// สร้าง audit trail ของ Ticket
function timelineOf(t) {
  const base = [
    { what:'สร้าง Ticket ผ่าน ' + t.channel + ' — ' + t.cat, who:t.requester, when:'วันนี้ 06:42', hot:false },
    { what:'AI Assistant เสนอคู่มือที่เกี่ยวข้อง 2 บทความ ผู้แจ้งเลือกส่ง Ticket ต่อ', who:'Knowledge Assistant', when:'วันนี้ 06:43', hot:false },
    { what:'Auto Routing มอบหมายตามกฎ ' + CONAME(t.company) + ' + ' + t.cat, who:'Routing Engine', when:'วันนี้ 06:43', hot:false }
  ];
  if (t.assignee !== '—') base.push({ what:'รับเรื่องและเริ่มตรวจสอบ', who:t.assignee, when:'วันนี้ 07:05', hot:false });
  if (t.status === 'รอรับเรื่อง') base.push({ what:'ยังไม่มีผู้รับเรื่อง — จะดันขึ้นหัวหน้าทีมอัตโนมัติเมื่อครบ 15 นาที', who:'SLA Service', when:'เมื่อสักครู่', hot:true });
  if (t.status === 'รอข้อมูลเพิ่ม') base.push({ what:'ขอข้อมูลเพิ่มจากผู้แจ้ง — นาฬิกา SLA หยุดชั่วคราว (Pending User)', who:t.assignee, when:'วันนี้ 09:20', hot:true });
  if (t.status === 'ปิดงานแล้ว') base.push({ what:'ปิดงานและส่งแบบประเมิน CSAT ให้ผู้แจ้ง', who:t.assignee, when:'เมื่อวาน 16:10', hot:false });
  return base.reverse();
}

/* ─────────────────────────── 17. Paint + คืนโฟกัส ─────────────────────────── */
function paint() {
  const a = document.activeElement;
  const fkey = a && a.dataset ? a.dataset.fkey : null;
  const ss = a && a.selectionStart, se = a && a.selectionEnd;

  $('#app').innerHTML = S.authed ? shell() : loginView();
  S.fresh = false;

  if (fkey) {
    const n = document.querySelector('#app [data-fkey="' + fkey + '"]');
    if (n) {
      n.focus();
      try { if (ss != null && n.setSelectionRange) n.setSelectionRange(ss, se); } catch (e) {}
    }
  }
  tickSla();
}

// สลับหน้าพร้อม skeleton สั้น ๆ เพื่อให้รู้สึกว่าระบบกำลังโหลดข้อมูลจริง
// keepKb = true เมื่อผู้เรียกตั้ง S.kbId ไว้แล้ว (เช่น Ticket Deflection ที่ต้องเปิดบทความนั้นเลย)
let loadTimer = null;
function goView(v, keepKb) {
  if (v === S.view && !S.loading) { if (!keepKb) S.kbId = null; paint(); return; }
  S.view = v; if (!keepKb) S.kbId = null; S.loading = true;
  paint();
  clearTimeout(loadTimer);
  loadTimer = setTimeout(() => { S.loading = false; S.fresh = true; paint(); window.scrollTo(0, 0); }, 230);
}

/* นาฬิกา SLA — อัปเดตทุกวินาทีเฉพาะโหนดที่แสดงอยู่จริง (ไม่ re-render ทั้งหน้า) */
function tickSla() {
  const nodes = document.querySelectorAll('[data-sla]');
  for (let i = 0; i < nodes.length; i++) {
    const node = nodes[i];
    const t = allTickets().find(x => x.id === node.getAttribute('data-sla'));
    if (!t) continue;
    const s = slaOf(t);
    const inDrawer = node.closest('#drawer');
    const txt = node.querySelector('[data-slatext]');
    if (txt) txt.textContent = (inDrawer && s.level !== 'done') ? s.clock : s.text;
    const bar = node.querySelector('.slabar');
    if (bar) {
      bar.className = 'slabar ' + (s.level === 'done' ? 'done' : s.level === 'ok' ? '' : (s.level === 'warn' ? 'warn' : 'crit')) +
        (inDrawer ? ' mt-3' : ' mt-1.5');
      const fill = bar.querySelector('i');
      if (fill) fill.style.width = s.pct.toFixed(1) + '%';
    }
  }
}
setInterval(tickSla, 1000);

/* นาฬิกาปลดล็อกบัญชีหน้าเข้าสู่ระบบ — เดินทุกวินาทีเฉพาะตอนที่ถูกล็อกจริง */
setInterval(function () {
  const el = document.querySelector('[data-lockleft]');
  if (!el) return;
  const ms = lockLeft();
  if (ms <= 0) { S.login.lockUntil = 0; S.login.tries = 0; paint(); return; }
  el.textContent = fmtLock(ms);
}, 1000);

/* ─────────────────────────── 18. ตัวจัดการเหตุการณ์ (event delegation) ─────────────────────────── */

const ACTIONS = {
  // — เข้าสู่ระบบ —
  login(el) {
    const a = ACCOUNTS[+el.dataset.i];
    Object.assign(S, { authed:true, role:a.role, view:a.role === 'employee' ? 'track' : 'my', openId:null, statusF:'all', cf:'ALL', fresh:true });
    paint();
    say('เข้าสู่ระบบสำเร็จผ่าน Active Directory SSO — สิทธิ์ ' + a.roleLabel + ' จาก group ' + a.group);
  },
  sso() {
    const a = ACCOUNTS[0];
    Object.assign(S, { authed:true, role:a.role, view:a.role === 'employee' ? 'track' : 'my', fresh:true });
    paint();
    say('เข้าสู่ระบบสำเร็จ — ' + a.name + ' · สิทธิ์ ' + a.roleLabel);
  },
  // — ฟอร์มชื่อผู้ใช้ / รหัสผ่าน —
  lf(el) {
    const k = el.dataset.k;
    S.login[k] = el.value;
    if (k === 'user') S.login.eu = ''; else S.login.ep = '';
    paint();
  },
  pwshow() { S.login.show = !S.login.show; paint(); },
  remember(el) { S.login.remember = !!el.checked; },
  disc(el) { S.login.disc = !S.login.disc; if (el && el.parentNode) el.parentNode.open = S.login.disc; },
  forgot() {
    say('รีเซ็ตรหัสผ่านเองได้ที่ sspr.aidc-group.local — ยืนยันตัวตนด้วย MFA แล้วตั้งรหัสใหม่ 12 ตัวขึ้นไป (ขั้นตอนเต็มอยู่ในคู่มือ KB-01)');
  },
  dologin() {
    const L = S.login;
    if (lockLeft() > 0) return;
    L.eu = L.user.trim() ? '' : 'กรุณากรอกชื่อผู้ใช้หรืออีเมลองค์กร';
    L.ep = L.pass ? '' : 'กรุณากรอกรหัสผ่าน';
    if (L.eu || L.ep) { paint(); return; }
    if (L.pass !== DEMO_PW) {
      L.tries++;
      L.ep = 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';
      if (L.tries >= MAX_TRIES) {
        L.lockUntil = Date.now() + LOCK_MIN * 60000;
        L.ep = '';
        paint();
        say('บัญชีถูกล็อก 15 นาที เพราะกรอกรหัสผ่านผิดครบ 5 ครั้ง ตามนโยบายรหัสผ่านในเอกสาร SOP — รีเซ็ตเองได้ที่ sspr.aidc-group.local หรือติดต่อ IT Hotline');
        return;
      }
      paint();
      return;
    }
    const a = loginAccountFor(L.user) || ACCOUNTS[0];
    const matched = !!loginAccountFor(L.user);
    Object.assign(S, { authed:true, role:a.role, view:a.role === 'employee' ? 'track' : 'my', openId:null, statusF:'all', cf:'ALL', fresh:true });
    S.login = { user:'', pass:'', show:false, remember:L.remember, eu:'', ep:'', tries:0, lockUntil:0, disc:false };
    paint();
    say('เข้าสู่ระบบสำเร็จ — ' + a.name + ' · สิทธิ์ ' + a.roleLabel +
        (matched ? ' จาก group ' + a.group : ' (ไม่พบชื่อผู้ใช้นี้ใน AD จึงเข้าเป็นพนักงานทั่วไป)') +
        (L.remember ? ' · จดจำอุปกรณ์นี้ไว้ 30 วัน' : ''));
  },
  unlock() {
    S.login.lockUntil = 0; S.login.tries = 0; S.login.ep = '';
    paint();
    say('ปลดล็อกบัญชีสำหรับการสาธิตแล้ว — ระบบจริงจะปลดอัตโนมัติเมื่อครบ 15 นาที');
  },
  signout() {
    closeDrawer(); closeModal(); closeMenu();
    Object.assign(S, { authed:false, view:'my', q:'', cf:'ALL', statusF:'all', kbId:null, fresh:true });
    S.role = 'employee';
    paint();
    say('ออกจากระบบแล้ว — เซสชัน SSO ถูกยกเลิกบนอุปกรณ์นี้');
  },
  theme() {
    S.dark = !S.dark;
    document.documentElement.classList.toggle('dark', S.dark);
    paint();
    if (S.menuOpen) openMenu();
    say(S.dark ? 'เปลี่ยนเป็นโหมดมืดแล้ว' : 'เปลี่ยนเป็นโหมดสว่างแล้ว');
  },

  // — เนวิเกชัน —
  nav(el) { closeMenu(); goView(el.dataset.view); },
  menu() { openMenu(); },
  closemenu() { closeMenu(); },

  // — ตัวกรอง —
  q(el) { S.q = el.value; paint(); },
  cf(el) { S.cf = el.dataset.code; paint(); },
  sf(el) { S.statusF = el.dataset.st; paint(); },
  clearf() { S.q = ''; S.cf = 'ALL'; S.statusF = 'all'; paint(); say('ล้างตัวกรองทั้งหมดแล้ว'); },

  // — Ticket —
  open(el) { openDrawer(el.dataset.id); },
  closedrawer() { closeDrawer(); },
  reply(el) { S.reply = el.value; refreshDrawerFooter(); },
  send() {
    if (!S.reply.trim()) return;
    S.reply = '';
    const d = $('#drawer'); const ta = d.querySelector('#dreply');
    if (ta) ta.value = '';
    refreshDrawerFooter();
    say('ส่งข้อความถึงผู้แจ้งแล้ว — แจ้งเตือนไปที่ LINE OA และอีเมลองค์กรพร้อมกัน');
  },
  claim() {
    if (!canWorkTickets()) return;
    const t = allTickets().find(x => x.id === S.openId);
    if (!t) return;
    t.assignee = me().name.split(' ')[0] + ' ' + (me().name.split(' ')[1] || '').charAt(0) + '.';
    t.status = 'กำลังดำเนินการ';
    $('#drawer').innerHTML = drawerHtml(t);
    paint();
    say('รับเรื่อง ' + t.id + ' แล้ว — สถานะเปลี่ยนเป็นกำลังดำเนินการ นาฬิกาตอบสนองแรกหยุดนับ');
  },
  resolve() {
    if (!canWorkTickets()) return;
    const t = allTickets().find(x => x.id === S.openId);
    if (t) { t.status = 'ปิดงานแล้ว'; t.slaMins = 0; t.closedAt = 'วันนี้ ' + nowHHMM(); S.csatFor = t.id; }
    closeDrawer();
    S.csatOpen = true; S.csatPick = 0;
    openModal(csatModal());
  },
  // เปลี่ยนสถานะจากแผงรายละเอียด — งานประจำวันของ Helpdesk
  dstatus(el) {
    if (!canWorkTickets()) return;
    const t = allTickets().find(x => x.id === S.openId);
    if (!t) return;
    t.status = el.value;
    if (t.status === 'ปิดงานแล้ว') { t.slaMins = 0; t.closedAt = 'วันนี้ ' + nowHHMM(); }
    $('#drawer').innerHTML = drawerHtml(t);
    paint();
    say('เปลี่ยนสถานะ ' + t.id + ' เป็น "' + t.status + '" แล้ว — บันทึกใน Audit Trail พร้อมผู้แก้ไขและเวลา');
  },
  // แนบไฟล์เพิ่มในเรื่องที่เปิดอยู่ — ทำได้ทุกบทบาท
  dattach() {
    say('แนบไฟล์เพิ่มใน ' + (S.openId || 'Ticket') + ' แล้ว — สูงสุด ' + SYS.maxFiles + ' ไฟล์ × ' + SYS.maxMb + ' MB ต่อหนึ่ง Ticket');
  },
  // ผู้ใช้ทั่วไปยืนยันปิดงานเอง แล้วเข้าสู่แบบประเมิน CSAT ทันที
  confirmclose() {
    const t = allTickets().find(x => x.id === S.openId);
    if (!t) return;
    t.status = 'ปิดงานแล้ว'; t.slaMins = 0; t.closedAt = 'วันนี้ ' + nowHHMM();
    S.csatFor = t.id;
    closeDrawer();
    S.csatOpen = true; S.csatPick = 0;
    openModal(csatModal());
    say('ยืนยันปิดงาน ' + t.id + ' แล้ว — ขอบคุณที่ยืนยันกลับมา');
  },
  // ให้คะแนนย้อนหลังจากหน้าประวัติการแจ้ง
  raterow(el) {
    S.csatFor = el.dataset.id;
    S.csatOpen = true; S.csatPick = 0;
    closeDrawer();
    openModal(csatModal());
  },
  // เปิดเรื่องซ้ำจากประวัติ
  reopen(el) {
    const t = allTickets().find(x => x.id === el.dataset.id);
    if (!t) return;
    const p = PRIO(t.prio);
    t.status = 'รอรับเรื่อง'; t.assignee = '—';
    t.slaMins = p.resMin; t.totalMins = p.resMin; t.closedAt = ''; 
    S.fresh = true;
    goView('track');
    say('เปิด ' + t.id + ' ขึ้นมาใหม่แล้ว — ประวัติเดิมถูกคงไว้ทั้งหมด และนาฬิกา SLA เริ่มนับใหม่ตามระดับ ' + t.prio);
  },
  viewasset(el) {
    const i = ASSETS.findIndex(a => a.code === el.dataset.code);
    closeDrawer();
    S.assetIdx = i < 0 ? 0 : i;
    goView('assets');
    say('เปิดประวัติซ่อมบำรุงของ ' + el.dataset.code + ' แล้ว');
  },

  // — ส่งต่อข้ามบริษัท —
  escopen() { S.escOpen = true; S.escWhy = ''; openModal(escModal()); },
  escto(el) { S.escTo = el.value; },
  escwhy(el) { S.escWhy = el.value; },
  escgo() {
    const to = CONAME(S.escTo);
    closeModal(); closeDrawer();
    say('ส่งต่อไปยัง ' + to + ' แล้ว — นาฬิกา SLA เริ่มนับใหม่ตามเงื่อนไขของบริษัทผู้รับ และบันทึกเหตุผลใน Audit Log');
  },

  // — CSAT —
  csatpick(el) { S.csatPick = +el.dataset.n; $('#modal').innerHTML = csatModal(); },
  csatsend() {
    const n = S.csatPick;
    const t = allTickets().find(x => x.id === S.csatFor);
    if (t) t.csat = n;
    S.csatFor = null;
    closeModal();
    paint();
    say('ขอบคุณสำหรับคะแนน ' + n + '/5 — บันทึกไว้กับ ' + (t ? t.id : 'Ticket') + ' และรวมเข้า KPI ของบริษัทและเจ้าหน้าที่แล้ว');
  },
  closemodal() { closeModal(); },

  // — ฟอร์มแจ้งเรื่องใหม่ —
  f(el) {
    const k = el.dataset.k;
    S.form[k] = el.value;
    if (k === 'company') {
      // เปลี่ยนบริษัท → รีเซ็ตหมวดหมู่เป็นหมวดแรกของบริษัทนั้น (dynamic form)
      const first = catsOf(el.value)[0];
      S.form.cat = first ? first.n : '';
      S.form.asset = ''; S.form.gps = '';
    }
    // เปลี่ยนหมวดหมู่ → ใช้ความเร่งด่วนเริ่มต้นที่ตั้งไว้ในหน้าตั้งค่าระบบ
    if (k === 'company' || k === 'cat') S.form.prio = catCfg(S.form.company, S.form.cat).prio || 'P3';
    if (k === 'title' || k === 'desc') S.deflected = false;
    paint();
  },
  prio(el) { S.form.prio = el.dataset.p; paint(); },
  pin() {
    S.form.gps = '13.7365, 100.5601';
    paint();
    say('ปักหมุดตำแหน่งไซต์งานจากอุปกรณ์แล้ว — พิกัดจะแนบไปกับ Ticket');
  },
  attach() {
    S.attached++;
    paint();
    say('แนบไฟล์แล้ว — รองรับภาพ วิดีโอ และเอกสารสูงสุด 25 MB ต่อไฟล์');
  },
  submit() {
    if (!formReady()) return;
    const p = PRIO(S.form.prio);
    const rule = ruleForForm();
    const agent = AGENTS[S.rr % AGENTS.length];
    const id = 'TCK-' + (2400 + S.extra.length);
    S.extra.unshift({
      id, company:S.form.company, title:S.form.title.trim(), cat:S.form.cat, prio:S.form.prio,
      status:'กำลังดำเนินการ', slaMins:p.resMin, totalMins:p.resMin, assignee:agent,
      requester:me().name, channel:'Web', dept:S.form.dept, asset:S.form.asset, mine:true, desc:S.form.desc.trim()
    });
    S.rr++; S.attached = 0; S.deflected = false;
    S.form = Object.assign({}, S.form, { title:'', desc:'', asset:'', gps:'' });
    goView('my');
    say('สร้าง ' + id + ' แล้ว · กฎที่ตรง: ' + rule.team + ' · มอบหมายให้ ' + agent + ' (' + rule.mode + ') · เป้าหมายแก้ไข ' + p.res);
  },

  // — ผู้ช่วย AI —
  deflect() {
    const h = aiHits();
    S.deflected = true;
    S.kbId = h[0] ? h[0].id : KB[0].id;
    goView('kb', true);   // คงบทความที่เลือกไว้ ไม่ให้ถูกล้างตอนสลับหน้า
    say('ยอดเยี่ยม — บันทึกเป็น Ticket Deflection แล้ว ช่วยลดปริมาณ Ticket ซ้ำซ้อนของกลุ่มบริษัท');
  },
  keepgoing() { S.deflected = true; paint(); say('ปิดคำแนะนำแล้ว — กรอกฟอร์มต่อได้เลย'); },

  // — คลังความรู้ —
  kbopen(el) { S.kbId = el.dataset.id; S.view = 'kb'; S.fresh = true; paint(); window.scrollTo(0, 0); },
  kbclose() { S.kbId = null; S.fresh = true; paint(); },

  // — ทรัพย์สิน / กฎ —
  asset(el) { S.assetIdx = +el.dataset.i; paint(); },
  rule(el) {
    if (!canEditData()) { say(NO_EDIT_WHY); return; }
    const i = +el.dataset.i;
    const off = !RULES[i].on;
    RULES[i].on = off;
    paint();
    say((off ? 'เปิดใช้' : 'ปิดใช้') + 'กฎข้อ ' + (i + 1) + ' แล้ว — บันทึกใน Audit Log พร้อมผู้แก้ไขและเวลา');
  },

  /* ─────────── หน้าตั้งค่าระบบ ─────────── */
  settab(el) {
    S.set.tab = el.dataset.k;
    S.set.inSec = true;
    S.fresh = true;
    paint();
    window.scrollTo(0, 0);
  },
  setback() { S.set.inSec = false; S.fresh = true; paint(); window.scrollTo(0, 0); },
  // แก้ค่าใน draft (ยังไม่มีผลกับระบบจนกว่าจะกดบันทึก)
  setf(el) {
    if (!canEditData()) return;
    setPath(draftOf(el.dataset.sec), el.dataset.path, el.value);
    paint();
  },
  setn(el) {
    if (!canEditData()) return;
    const v = el.value === '' ? '' : Math.max(0, +el.value || 0);
    setPath(draftOf(el.dataset.sec), el.dataset.path, v);
    paint();
  },
  setsw(el) {
    if (!canEditData()) return;
    const sec = el.dataset.sec, p = el.dataset.path, d = draftOf(sec);
    setPath(d, p, !getPath(d, p));
    paint();
  },
  // เมทริกซ์ RBAC แยกเป็น action ของตัวเอง เพราะรหัสสิทธิ์มีจุดอยู่ในชื่อ (ticket.view.own)
  setperm(el) {
    if (!canEditData()) return;
    const d = draftOf('role'), r = el.dataset.r, k = el.dataset.p;
    if (!d.rbac[r]) d.rbac[r] = {};
    d.rbac[r][k] = !d.rbac[r][k];
    paint();
  },
  setadd(el) { if (!canEditData()) return say(NO_EDIT_WHY); secAdd(el.dataset.sec, el.dataset.what); paint(); },
  setdel(el) { if (!canEditData()) return say(NO_EDIT_WHY); secDel(el.dataset.sec, el.dataset.what, +el.dataset.i); paint(); },
  setmove(el) {
    if (!canEditData()) return say(NO_EDIT_WHY);
    const d = draftOf(el.dataset.sec), arr = getPath(d, el.dataset.path);
    const i = +el.dataset.i, j = i + (el.dataset.dir === 'up' ? -1 : 1);
    if (!arr || j < 0 || j >= arr.length) return;
    const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    paint();
  },
  setsave() { if (!canEditData()) return say(NO_EDIT_WHY); saveSec(curSec()); },
  setcancel() {
    if (!canEditData()) return;
    const k = curSec();
    if (!isDirty(k)) return;
    delete DRAFTS[k];
    paint();
    say('ยกเลิกการแก้ไขหมวด "' + secLabel(k) + '" แล้ว — ค่ากลับไปเป็นค่าที่บันทึกไว้ล่าสุด');
  },
  // ตัวกรองย่อยภายในหมวด
  setq(el) { S.set[el.dataset.k] = el.value; paint(); },
  setpick(el) { S.set[el.dataset.k] = el.dataset.v; paint(); },
  // ยืนยันก่อนทำสิ่งที่ย้อนกลับไม่ได้
  askco(el) {
    if (!canEditData()) return say(NO_EDIT_WHY);
    const i = +el.dataset.i, c = draftOf('co')[i];
    if (c.active) {
      S.confirm = { key:'co-off', i:i,
        title:'ปิดใช้งาน ' + c.name + '?',
        body:'บริษัทนี้จะหายจากชิปตัวกรองในหน้าคิวงาน และจากตัวเลือกบริษัทในฟอร์มแจ้งเรื่องทันทีที่กดบันทึก ' +
             'Ticket เดิมยังอยู่ครบและยังเปิดดูได้ แต่จะแจ้งเรื่องใหม่ในนามบริษัทนี้ไม่ได้อีก',
        ok:'ปิดใช้งานบริษัท' };
      openModal(confirmModal());
    } else { draftOf('co')[i].active = true; paint(); }
  },
  askrole(el) {
    if (!canEditData()) return say(NO_EDIT_WHY);
    const i = +el.dataset.i, r = draftOf('role').roles[i];
    S.confirm = { key:'role-del', i:i,
      title:'ลบบทบาท "' + r.label + '"?',
      body:'ผู้ใช้ ' + r.n.toLocaleString() + ' คนที่ถือบทบาทนี้จะถูกลดสิทธิ์ลงเหลือ "ผู้ใช้งานทั่วไป" ทันที ' +
           'การลบบทบาทย้อนกลับไม่ได้ — ต้องสร้างใหม่และตั้งค่าสิทธิ์ใหม่ทั้งหมด',
      ok:'ลบบทบาทนี้' };
    openModal(confirmModal());
  },
  askmaint() {
    if (!canEditData()) return say(NO_EDIT_WHY);
    const d = draftOf('sys');
    if (d.maint) { d.maint = false; paint(); return; }
    S.confirm = { key:'maint',
      title:'เปิดโหมดปิดปรับปรุงระบบ?',
      body:'ผู้ใช้ทุกคนยกเว้น Central IT จะถูกตัดออกจากระบบและเห็นเฉพาะข้อความประกาศ ' +
           'ช่องทางรับแจ้งทั้งหมดจะหยุดสร้าง Ticket ใหม่ นาฬิกา SLA ของ Ticket ที่ค้างอยู่จะหยุดนับตามข้อยกเว้น "ปิดปรับปรุงตามแผน" (SLA ข้อ 9)',
      ok:'เปิดโหมดปิดปรับปรุง' };
    openModal(confirmModal());
  },
  cfmgo() {
    if (!canEditData()) return closeModal();
    const c = S.confirm;
    if (!c) return closeModal();
    if (c.key === 'co-off') {
      const co = draftOf('co')[c.i];
      co.active = false;
      closeModal();
      paint();
      say('ตั้งค่าให้ปิดใช้งาน ' + co.name + ' แล้ว — กด "บันทึกการเปลี่ยนแปลง" เพื่อให้มีผลกับทั้งระบบ');
    } else if (c.key === 'role-del') {
      const d = draftOf('role');
      const r = d.roles[c.i];
      d.roles.splice(c.i, 1);
      delete d.rbac[r.k];
      closeModal();
      paint();
      say('ลบบทบาท ' + r.label + ' ออกจากร่างแล้ว — กดบันทึกเพื่อยืนยัน');
    } else if (c.key === 'maint') {
      draftOf('sys').maint = true;
      closeModal();
      paint();
      say('ตั้งค่าเปิดโหมดปิดปรับปรุงแล้ว — จะมีผลเมื่อกดบันทึกการเปลี่ยนแปลง');
    } else closeModal();
    S.confirm = null;
  },
  // ปุ่มสาธิตที่ทำงานได้จริงในระดับ prototype
  settest(el) {
    if (!canEditData()) return say(NO_EDIT_WHY);
    const ch = el.dataset.ch || 'อีเมล';
    say('ส่งข้อความทดสอบผ่าน ' + ch + ' ไปยัง ' + me().mail + ' แล้ว — ตรวจผลได้ที่ Audit Log หมวดการเชื่อมต่อ');
  },
  setping(el) {
    const n = (INTG.find(x => x.k === el.dataset.k) || {}).name || 'ระบบปลายทาง';
    say('ทดสอบการเชื่อมต่อ ' + n + ' สำเร็จ — ตอบกลับใน 0.4 วินาที และบันทึกผลลง Audit Log แล้ว');
  },
  setexport() { say('ส่งออก Audit Log ตามตัวกรองปัจจุบันเป็นไฟล์ CSV แล้ว — ไฟล์ถูกเข้ารหัสตามนโยบาย PDPA ข้อ 3.8'); },
  setpw(el) { if (!canEditData()) return say(NO_EDIT_WHY); say('ส่งลิงก์รีเซ็ตรหัสผ่านให้ ' + el.dataset.n + ' ทางอีเมลองค์กรแล้ว — ลิงก์หมดอายุใน 30 นาที'); },
  setunlock(el) {
    if (!canEditData()) return say(NO_EDIT_WHY);
    const u = draftOf('user').list.find(x => x.mail === el.dataset.m);
    if (u) u.locked = false;
    paint();
    say('ปลดล็อกบัญชี ' + el.dataset.n + ' แล้ว — กดบันทึกเพื่อยืนยันการเปลี่ยนแปลง');
  }
};

// คลิก / แตะ
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  // input/select/textarea จัดการที่ event 'input'/'change' แทน
  if (el.tagName === 'INPUT' || el.tagName === 'SELECT' || el.tagName === 'TEXTAREA') return;
  if (ACTIONS[act]) { e.preventDefault(); ACTIONS[act](el, e); }
});
// พิมพ์
document.addEventListener('input', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (ACTIONS[el.dataset.act]) ACTIONS[el.dataset.act](el, e);
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.tagName !== 'SELECT') return;
  if (ACTIONS[el.dataset.act]) ACTIONS[el.dataset.act](el, e);
});
// เปิดแถวตารางด้วยคีย์บอร์ด
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (S.escOpen || S.csatOpen) return closeModal();
    if (S.menuOpen) return closeMenu();
    if (S.openId) return closeDrawer();
  }
  if (e.key === 'Enter' || e.key === ' ') {
    const el = e.target.closest('tr[data-act]');
    if (el) { e.preventDefault(); ACTIONS[el.dataset.act](el, e); }
  }
});
// กด Enter ในฟอร์มเข้าสู่ระบบให้เท่ากับกดปุ่ม "เข้าสู่ระบบ" (ไม่ใช่รีโหลดหน้า)
document.addEventListener('submit', e => {
  if (e.target && e.target.id === 'loginForm') { e.preventDefault(); ACTIONS.dologin(); }
});

// คลิกฉากหลังเพื่อปิด overlay
$('#scrim').addEventListener('click', () => {
  if (S.escOpen || S.csatOpen) return closeModal();
  if (S.menuOpen) return closeMenu();
  if (S.openId) return closeDrawer();
});

// เปิดตาราง action ให้เครื่องมือทดสอบอัตโนมัติตรวจว่าไม่มีปุ่มที่กดแล้วไม่เกิดอะไร (dead click)
window.__ACTIONS__ = ACTIONS;

/* ─────────────────────────── 19. เริ่มทำงาน ─────────────────────────── */
// เคารพการตั้งค่าธีมของระบบผู้ใช้ตั้งแต่โหลดครั้งแรก
if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
  S.dark = true;
  document.documentElement.classList.add('dark');
}
paint();
</script>
</body>
</html>
