<!doctype html>
<html lang="th" class="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIDC Service Desk</title>
<meta name="description" content="ศูนย์บริการไอทีและงานซ่อมบำรุงกลางของกลุ่มบริษัท AIDC 7 บริษัท">

<!-- ── ตัวอักษร: Archivo สำหรับหัวเรื่อง/ตัวเลขละติน, IBM Plex Sans Thai สำหรับเนื้อหาไทย ── -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">

<!-- ── Tailwind Play CDN + ผูกชุดสีแบรนด์เข้ากับ theme.extend.colors ── -->
<script src="https://cdn.tailwindcss.com"
        onerror="document.documentElement.classList.add('no-tw')"></script>
<script>
  // สีทุกตัวชี้ไปที่ CSS variable เพื่อให้สลับ light/dark ได้จากจุดเดียว
  // (กัน error กรณีเปิดไฟล์ตอนไม่มีเน็ต — สไตล์หลักอยู่ใน <style> ด้านล่างอยู่แล้ว)
  window.tailwind = window.tailwind || {};
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          canvas:    'var(--c-bg)',        // พื้นหลังหลัก
          surface:   'var(--c-surface)',   // พื้นแผง/แถบข้าง
          card:      'var(--c-card)',      // พื้นการ์ดที่ยกขึ้นมา
          ink:       'var(--c-ink)',       // ตัวอักษรหลัก
          muted:     'var(--c-muted)',     // ตัวอักษรรอง
          faint:     'var(--c-faint)',     // ตัวอักษรจาง / eyebrow
          hair:      'var(--c-hair)',      // เส้น hairline ตกแต่ง
          'hair-soft':'var(--c-hair-soft)', // เส้นคั่นภายในการ์ด/แถวตาราง
          line:      'var(--c-line)',      // เส้นขอบเชิงหน้าที่ (input/ปุ่ม)
          accent:    'var(--c-accent)',    // สีแบรนด์ — ใช้เป็นพื้น/แถบ ไม่ใช้เป็นตัวอักษร
          'accent-text': 'var(--c-accent-text)', // สีแบรนด์เวอร์ชันที่ผ่าน AA เมื่อเป็นตัวอักษร
          'accent-btn':  'var(--c-accent-btn)',
          'accent-soft': 'var(--c-accent-soft)',
          'accent-soft-ink': 'var(--c-accent-soft-ink)',
          'on-accent':   'var(--c-on-accent)'
        },
        fontFamily: {
          display: ['Archivo', 'IBM Plex Sans Thai', 'system-ui', 'sans-serif'],
          body:    ['IBM Plex Sans Thai', 'Archivo', 'system-ui', 'sans-serif']
        },
        borderRadius: { none: '0' }
      }
    }
  };
</script>

<style>
/* ═══════════════════════════════════════════════════════════════
   1. TOKENS — ชุดสีแบรนด์เดิม แยกบทบาท "พื้น" กับ "ตัวอักษร"
      เพื่อให้ทุกคู่สีผ่าน WCAG AA (ตรวจด้วย contrast.py)
   ═══════════════════════════════════════════════════════════════ */
:root {
  /* neutral ramp */
  --n-50:#f8f4f4; --n-100:#eae7e7; --n-200:#d7d3d3; --n-300:#bab6b6; --n-400:#9b9797;
  --n-500:#7d7979; --n-600:#605d5d; --n-700:#444141; --n-800:#2d2b2b; --n-900:#201e1d;
  --n-950:#161514;
  /* accent ramp */
  --a-50:#fff2ef; --a-100:#ffe0d9; --a-200:#ffc4b8; --a-300:#ff9783; --a-400:#ff563c;
  --a-500:#ec3013; --a-600:#dd2b0f; --a-700:#ae1800; --a-800:#7c1405; --a-900:#4d170e;

  /* บทบาทสีในโหมดสว่าง */
  --c-bg:#f3f2f2;
  --c-surface:#eae9e9;
  --c-card:#f8f4f4;
  --c-ink:#201e1d;
  --c-muted:#444141;
  --c-faint:#605d5d;
  --c-hair:#d7d3d3;
  --c-hair-soft:#eae7e7;       /* เส้นคั่น "ภายใน" การ์ด/แถวตาราง — บางกว่าขอบนอกหนึ่งขั้น */
  --c-rail:#bab6b6;
  --c-line:#7d7979;
  --c-accent:#ec3013;          /* พื้น/แถบเท่านั้น — ไม่มีตัวอักษรวางทับ */
  --c-accent-text:#ae1800;     /* 6.41:1 บนพื้นหลัก — AA */
  --c-accent-btn:#dd2b0f;      /* ขาวบนพื้นนี้ 4.74:1 — AA */
  --c-accent-btn-hover:#ae1800;
  --c-accent-soft:#ffe0d9;
  --c-accent-soft-ink:#7c1405; /* 8.63:1 — AAA */
  --c-on-accent:#ffffff;
  --c-shadow:0 1px 1px rgba(32,30,29,.05), 0 2px 5px -2px rgba(32,30,29,.07), 0 12px 28px -16px rgba(32,30,29,.20);
  --c-shadow-lift:0 1px 2px rgba(32,30,29,.07), 0 4px 10px -4px rgba(32,30,29,.10), 0 24px 52px -22px rgba(32,30,29,.32);
  --c-btn-edge:rgba(77,23,14,.42);   /* ขอบล่างในปุ่มหลัก ให้ปุ่มมีน้ำหนักภาพ ไม่แบน */
  --c-ring:var(--c-accent-soft);
  --tap:44px;
  /* สเกลตัวอักษรชุดเดียวทั้งระบบ */
  --fs-micro:10.5px; --fs-fine:11.5px; --fs-sm:12.5px; --fs-body:13.5px; --fs-base:15px; --fs-lead:17px;
  color-scheme: light;
}
html.dark {
  --c-bg:#161514;
  --c-surface:#201e1d;
  --c-card:#2d2b2b;
  --c-ink:#f3f2f2;
  --c-muted:#bab6b6;
  --c-faint:#9b9797;
  --c-hair:#444141;
  /* โหมดมืด: การ์ดเป็น #2d2b2b อยู่แล้ว เส้นคั่นจึงต้องสว่างกว่าการ์ด ไม่ใช่เข้มกว่า */
  --c-hair-soft:#444141;
  --c-rail:#605d5d;
  --c-line:#7d7979;
  --c-accent:#ff563c;
  --c-accent-text:#ff9783;     /* 8.69:1 บนพื้นมืด — AAA */
  --c-accent-btn:#ff563c;
  --c-accent-btn-hover:#ff9783;
  --c-accent-soft:#4d170e;
  --c-accent-soft-ink:#ffc4b8; /* 9.58:1 — AAA */
  --c-on-accent:#161514;       /* 5.77:1 บน #ff563c — AA */
  --c-shadow:0 1px 1px rgba(0,0,0,.34), 0 2px 5px -2px rgba(0,0,0,.42), 0 12px 28px -16px rgba(0,0,0,.62);
  --c-shadow-lift:0 1px 2px rgba(0,0,0,.44), 0 4px 10px -4px rgba(0,0,0,.5), 0 24px 52px -22px rgba(0,0,0,.72);
  --c-btn-edge:rgba(0,0,0,.34);
  color-scheme: dark;
}

/* ═══════════════════════════════════════════════════════════════
   2. ฐาน — มุมคม 0 ทั้งระบบ, ไทยอ่านสบาย line-height 1.65
   ═══════════════════════════════════════════════════════════════ */
*,*::before,*::after { box-sizing:border-box; border-radius:0; }
html { -webkit-text-size-adjust:100%; }
html body {
  margin:0;
  background:var(--c-bg);
  color:var(--c-ink);
  font-family:'IBM Plex Sans Thai','Archivo',system-ui,sans-serif;
  font-size:15px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,h4,h5,h6 { margin:0; text-wrap:balance; line-height:1.22; font-weight:700; }
p { margin:0; }
button,input,select,textarea { font:inherit; color:inherit; }
button { background:none; border:0; cursor:pointer; }
img,svg { display:block; max-width:100%; }
table { border-collapse:collapse; width:100%; }
ol,ul { margin:0; padding:0; }

/* grid/flex item มี min-width:auto เป็นค่าเริ่มต้น ทำให้ <select> หรือตารางกว้าง ๆ
   ดันทั้งหน้าให้เลื่อนแนวนอนบนมือถือ — บังคับให้ยุบได้ แล้วปล่อยให้กล่องของตัวเองเลื่อนแทน */
.grid > *, .field, .input, .tbl-wrap { min-width:0; max-width:100%; }

/* ตัวเลขเรียงคอลัมน์ให้ตรงกันเสมอ */
.num, .tbl td, .tbl th, .kpi-val, .stat-val { font-variant-numeric:tabular-nums; }

/* โฟกัสคีย์บอร์ดต้องเห็นชัดทุกจุด */
:focus-visible {
  outline:2px solid var(--c-accent-text);
  outline-offset:2px;
}
html.dark :focus-visible { outline-color:var(--c-accent-text); }

@media (prefers-reduced-motion: reduce) {
  *,*::before,*::after { animation-duration:.001ms !important; transition-duration:.001ms !important; }
}

/* ═══════════════════════════════════════════════════════════════
   3. ตัวอักษร — สเกลชุดเดียวทั้งระบบ (micro 10.5 / fine 11.5 / sm 12.5 /
      body 13.5 / base 15 / lead 17) แล้วต่อด้วยสเกลหัวเรื่องและตัวเลขสถิติ
   ═══════════════════════════════════════════════════════════════ */
.font-display { font-family:'Archivo','IBM Plex Sans Thai',system-ui,sans-serif; }
.eyebrow {
  font-family:'Archivo',system-ui,sans-serif;
  font-size:var(--fs-micro); font-weight:600; letter-spacing:.11em; text-transform:uppercase;
  color:var(--c-faint); line-height:1.45;
}
.eyebrow-accent { color:var(--c-accent-text); }

.display-xl {
  font-family:'Archivo',sans-serif; font-weight:800;
  font-size:clamp(2.15rem,5.1vw,3.85rem); line-height:.98; letter-spacing:-.038em;
  text-transform:none; text-wrap:balance;
}
.display-lg { font-family:'Archivo',sans-serif; font-weight:800; font-size:clamp(1.4rem,2.4vw,1.85rem); line-height:1.18; letter-spacing:-.022em; }
.display-md { font-family:'Archivo',sans-serif; font-weight:700; font-size:1.0625rem; line-height:1.32; letter-spacing:-.012em; }
.display-sm { font-family:'Archivo',sans-serif; font-weight:700; font-size:var(--fs-base); line-height:1.4; letter-spacing:-.008em; }

/* ตัวเลขสถิติ — แยกจากหัวเรื่อง เพราะทำหน้าที่คนละอย่าง */
.stat-xl { font-family:'Archivo',sans-serif; font-weight:800; font-size:2.05rem; line-height:.96; letter-spacing:-.032em; }
.stat-lg { font-family:'Archivo',sans-serif; font-weight:800; font-size:1.8rem;  line-height:.98; letter-spacing:-.03em; }
.stat-md { font-family:'Archivo',sans-serif; font-weight:800; font-size:1.55rem; line-height:1;   letter-spacing:-.028em; }

/* ไทยต้องมีที่ให้วรรณยุกต์ — ห้ามต่ำกว่า 1.55 ในข้อความยาว */
.lede { color:var(--c-muted); font-size:var(--fs-body); line-height:1.72; max-width:62ch; }
.leading-relaxed { line-height:1.68 !important; }
.leading-snug { line-height:1.45 !important; }

/* จังหวะหายใจของหัวข้อ section — ใช้ชุดเดียวกันทุกหน้า */
.sec-head { display:flex; align-items:baseline; justify-content:space-between; gap:1rem; margin-bottom:.6rem; }

/* ═══════════════════════════════════════════════════════════════
   4. เส้นและพื้นผิว — ลำดับชั้นมาจากน้ำหนักเส้น ไม่ใช่กรอบหนา
   ═══════════════════════════════════════════════════════════════ */
.hair-b { border-bottom:1px solid var(--c-hair); }
.hair-t { border-top:1px solid var(--c-hair); }
.hair-r { border-right:1px solid var(--c-hair); }
.hair-l { border-left:1px solid var(--c-hair); }
.hair-all { border:1px solid var(--c-hair); }
/* เส้นคั่น "ภายใน" การ์ด — บางกว่าขอบนอกหนึ่งขั้น เพื่อไม่ให้เกิดกรอบซ้อนกรอบ */
.rule-in { border-top:1px solid var(--c-hair-soft); }
.rule-accent { width:34px; height:3px; background:var(--c-accent); }
.panel { background:var(--c-card); border:1px solid var(--c-hair); }
.panel-flat { background:var(--c-surface); border:1px solid var(--c-hair); }
.panel-head { padding:1.15rem 1.25rem .95rem; border-bottom:1px solid var(--c-hair-soft); }
.lift { box-shadow:var(--c-shadow); }

/* ═══════════════════════════════════════════════════════════════
   5. ปุ่ม — สเกล sm / md / lg, พื้นที่แตะ ≥44px บนจอสัมผัส,
      hover เข้มขึ้น + เงาบาง, active จมลง 1px, focus เป็นวงแหวนนุ่ม
   ═══════════════════════════════════════════════════════════════ */
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:.5rem;
  min-height:40px; padding:0 1.05rem;
  font-family:'IBM Plex Sans Thai',sans-serif; font-size:var(--fs-body); font-weight:600;
  letter-spacing:.004em; line-height:1.2;
  border:1px solid transparent; white-space:nowrap;
  transition:background-color .16s ease, color .16s ease, border-color .16s ease,
             box-shadow .16s ease, transform .12s ease;
}
.btn > svg { flex:none; }
.btn:active:not([disabled]) { transform:translateY(1px); }
.btn[disabled] { opacity:.42; cursor:not-allowed; box-shadow:none; }
.btn[disabled]:active { transform:none; }
.btn-sm { min-height:34px; padding:0 .8rem; gap:.4rem; font-size:var(--fs-sm); }
.btn-lg { min-height:48px; padding:0 1.4rem; gap:.6rem; font-size:var(--fs-base); letter-spacing:.008em; }
.btn-icon { width:40px; min-height:40px; padding:0; }
@media (pointer:coarse) {
  .btn, .btn-sm { min-height:var(--tap); }
  .btn-icon { width:var(--tap); min-height:var(--tap); }
}

.btn-primary {
  background:var(--c-accent-btn); color:var(--c-on-accent);
  box-shadow:inset 0 -2px 0 0 var(--c-btn-edge), 0 1px 1px rgba(32,30,29,.10);
}
.btn-primary:hover:not([disabled]) {
  background:var(--c-accent-btn-hover);
  box-shadow:inset 0 -2px 0 0 rgba(0,0,0,.34), 0 2px 8px -2px rgba(174,24,0,.35);
}
.btn-primary:active:not([disabled]) { box-shadow:inset 0 2px 3px rgba(0,0,0,.22); }
html.dark .btn-primary:hover:not([disabled]) { color:#161514; }

.btn-secondary { background:transparent; color:var(--c-ink); border-color:var(--c-line); }
.btn-secondary:hover:not([disabled]) { background:var(--c-surface); border-color:var(--c-ink); box-shadow:0 1px 1px rgba(32,30,29,.05); }
html.dark .btn-secondary:hover:not([disabled]) { box-shadow:0 1px 1px rgba(0,0,0,.4); }
.btn-ink { background:var(--c-ink); color:var(--c-bg); box-shadow:inset 0 -2px 0 0 rgba(0,0,0,.22); }
.btn-ink:hover:not([disabled]) { background:var(--c-muted); }
.btn-ghost {
  background:transparent; color:var(--c-accent-text); padding:0 .4rem; min-height:2rem;
  font-weight:600; text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:3px;
}
.btn-ghost:hover { background:var(--c-accent-soft); color:var(--c-accent-soft-ink); text-decoration:none; }
.btn-ghost-sm { font-size:var(--fs-sm); }
@media (pointer:coarse) { .btn-ghost { min-height:2.5rem; } }

/* วงแหวนโฟกัส: เส้นสีแบรนด์ + ฮาโลอ่อน แทนกรอบดำของเบราว์เซอร์ */
.btn:focus-visible, .chip:focus-visible, .navitem:focus-visible,
.prio-card:focus-visible, .sw:focus-visible, .disc > summary:focus-visible {
  outline:2px solid var(--c-accent-text); outline-offset:2px;
  box-shadow:0 0 0 4px var(--c-ring);
}

/* ═══════════════════════════════════════════════════════════════
   6. ฟอร์ม — input ≥16px กัน iOS zoom
   ═══════════════════════════════════════════════════════════════ */
.field { display:flex; flex-direction:column; gap:.4rem; }
.field > label, .lbl {
  font-family:'Archivo',sans-serif; font-size:var(--fs-fine); font-weight:600;
  letter-spacing:.09em; text-transform:uppercase; color:var(--c-faint);
}
.input {
  width:100%; min-height:44px; padding:.65rem .8rem;
  font-size:16px; line-height:1.5;
  background:var(--c-bg); color:var(--c-ink);
  border:1px solid var(--c-line);
  transition:border-color .16s ease, box-shadow .16s ease, background-color .16s ease;
}
.input::placeholder { color:var(--c-faint); opacity:1; }
.input:hover { border-color:var(--c-ink); }
.input:focus { outline:none; border-color:var(--c-accent-text); box-shadow:inset 0 -2px 0 0 var(--c-accent), 0 0 0 3px var(--c-ring); }
.input[aria-invalid="true"] { border-color:var(--c-accent-text); box-shadow:inset 0 -2px 0 0 var(--c-accent); }
.input-search { padding-left:2.25rem; }
.input-pw { padding-right:3rem; }
textarea.input { min-height:112px; resize:vertical; line-height:1.65; }
select.input {
  appearance:none; padding-right:2.25rem; cursor:pointer;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8' fill='none' stroke='%23444141' stroke-width='1.6'%3E%3Cpath d='M1 1.5 6 6.5 11 1.5'/%3E%3C/svg%3E");
  background-repeat:no-repeat; background-position:right .8rem center; background-size:11px;
}
html.dark select.input {
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8' fill='none' stroke='%23bab6b6' stroke-width='1.6'%3E%3Cpath d='M1 1.5 6 6.5 11 1.5'/%3E%3C/svg%3E");
}

/* ข้อความผิดพลาดใต้ช่องกรอก */
.err-text {
  display:flex; align-items:flex-start; gap:.4rem;
  color:var(--c-accent-text); font-size:var(--fs-sm); line-height:1.6; font-weight:500;
}
.err-text > svg { flex:none; width:14px; height:14px; margin-top:2px; }

/* ปุ่มสลับดู/ซ่อนรหัสผ่าน — วางในกรอบเดียวกับ input */
.pw-wrap { position:relative; }
.pw-toggle {
  position:absolute; top:1px; right:1px; bottom:1px; width:44px;
  display:grid; place-items:center; color:var(--c-faint);
  border-left:1px solid var(--c-hair-soft);
  transition:color .16s ease, background-color .16s ease;
}
.pw-toggle:hover { color:var(--c-ink); background:var(--c-surface); }
.pw-toggle:focus-visible { outline:2px solid var(--c-accent-text); outline-offset:-2px; }

/* checkbox แบบมุมคม ทำเอง ไม่พึ่ง appearance เริ่มต้น */
.check { display:inline-flex; align-items:center; gap:.55rem; cursor:pointer; min-height:36px; font-size:var(--fs-body); }
.check input { position:absolute; opacity:0; width:0; height:0; }
.check i {
  flex:none; width:17px; height:17px; display:grid; place-items:center;
  border:1.5px solid var(--c-line); background:var(--c-bg);
  transition:background-color .16s ease, border-color .16s ease;
}
.check i::after {
  content:''; width:9px; height:5px; border-left:2px solid var(--c-on-accent); border-bottom:2px solid var(--c-on-accent);
  transform:rotate(-45deg) scale(.6); transform-origin:center; opacity:0; margin-top:-2px;
  transition:opacity .16s ease, transform .16s ease;
}
.check input:checked + i { background:var(--c-accent-btn); border-color:var(--c-accent-btn); }
.check input:checked + i::after { opacity:1; transform:rotate(-45deg) scale(1); }
.check input:focus-visible + i { outline:2px solid var(--c-accent-text); outline-offset:2px; box-shadow:0 0 0 4px var(--c-ring); }

/* ── ช่องกรอกที่ถูกปิดตามสิทธิ์ (RBAC) — ต้องยังอ่านออก ไม่ใช่จางจนหาย ──
   ใช้ faint บน surface ซึ่งผ่าน AA อยู่แล้ว แทนการลด opacity ที่ทำให้ contrast ตก */
.input:disabled, .input[disabled] {
  background:var(--c-surface); color:var(--c-faint); border-color:var(--c-hair);
  cursor:not-allowed; opacity:1; -webkit-text-fill-color:var(--c-faint);
}
.input:disabled:hover, .input[disabled]:hover { border-color:var(--c-hair); }
.check input:disabled + i { background:var(--c-surface); border-color:var(--c-hair); }
.check input:disabled + i::after { border-color:var(--c-faint); }
.sw[disabled] { opacity:.55; cursor:not-allowed; }
.sw[disabled] i { box-shadow:none; }

/* ตัวคั่น "หรือ" */
.divider-or {
  display:flex; align-items:center; gap:.85rem;
  font-family:'Archivo',sans-serif; font-size:var(--fs-micro); font-weight:600;
  letter-spacing:.14em; text-transform:uppercase; color:var(--c-faint);
}
.divider-or::before, .divider-or::after { content:''; flex:1; height:1px; background:var(--c-hair); }

/* disclosure บัญชีที่จดจำไว้ */
.disc > summary {
  display:flex; align-items:center; gap:.6rem; min-height:48px; padding:0 1rem;
  cursor:pointer; list-style:none; font-size:var(--fs-body); font-weight:600; color:var(--c-ink);
}
.disc > summary::-webkit-details-marker { display:none; }
.disc > summary .chev { margin-left:auto; color:var(--c-faint); transition:transform .18s ease; }
.disc[open] > summary .chev { transform:rotate(90deg); }

/* กล่องหมายเหตุสำหรับผู้ทดสอบระบบ */
.devnote {
  border:1px dashed var(--c-rail); background:var(--c-surface);
  padding:.7rem .85rem; font-size:var(--fs-fine); line-height:1.65; color:var(--c-muted);
}
.devnote code {
  font-family:'Archivo',ui-monospace,monospace; font-weight:600; letter-spacing:.02em;
  color:var(--c-ink); background:var(--c-bg); border:1px solid var(--c-hair); padding:.05rem .3rem;
}

/* radio ความเร่งด่วน — การ์ดเลือกได้ */
.prio-card {
  display:flex; align-items:center; gap:.75rem; width:100%;
  min-height:58px; padding:.65rem .85rem; text-align:left;
  background:var(--c-bg); border:1px solid var(--c-hair);
  transition:border-color .16s ease, background-color .16s ease, box-shadow .16s ease;
}
.prio-card:hover { border-color:var(--c-line); background:var(--c-surface); }
.prio-card[aria-checked="true"] {
  border-color:var(--c-ink); background:var(--c-surface);
  box-shadow:inset 3px 0 0 0 var(--c-accent);
}
.prio-radio {
  flex:none; width:16px; height:16px; border:1.5px solid var(--c-line);
  display:grid; place-items:center; transition:border-color .16s ease;
}
.prio-card[aria-checked="true"] .prio-radio { border-color:var(--c-accent-text); }
.prio-radio i { width:8px; height:8px; background:var(--c-accent); opacity:0; transition:opacity .16s ease; }
.prio-card[aria-checked="true"] .prio-radio i { opacity:1; }

/* ═══════════════════════════════════════════════════════════════
   7. ป้าย / ตัวบ่งชี้ — แยกได้โดยไม่พึ่งสี (สี + รูปทรง + ไอคอน + ข้อความ)
   ═══════════════════════════════════════════════════════════════ */
.tag {
  display:inline-flex; align-items:center; gap:.3rem;
  padding:.22rem .48rem; font-family:'Archivo',sans-serif;
  font-size:var(--fs-micro); font-weight:600; letter-spacing:.045em; line-height:1.45;
  white-space:nowrap; border:1px solid transparent;
}
.tag > svg { width:12px; height:12px; flex:none; }
.tag-solid { background:var(--c-accent-btn); color:var(--c-on-accent); box-shadow:inset 0 -1px 0 0 var(--c-btn-edge); }
.tag-soft  { background:var(--c-accent-soft); color:var(--c-accent-soft-ink); }
.tag-quiet { background:var(--c-surface); color:var(--c-muted); border-color:var(--c-hair); }
.tag-outline { background:transparent; color:var(--c-ink); border-color:var(--c-line); }

/* มาตรวัดความเร่งด่วน: P1=4 ขีด … P4=1 ขีด (รูปทรงบอกระดับโดยไม่ต้องดูสี) */
.meter { display:inline-flex; align-items:flex-end; gap:2px; height:13px; }
.meter i { width:3px; background:var(--c-hair); display:block; transition:background-color .16s ease; }
.meter i:nth-child(1){height:4px}   .meter i:nth-child(2){height:7px}
.meter i:nth-child(3){height:10px}  .meter i:nth-child(4){height:13px}
.meter i.on { background:var(--c-muted); }
.meter.crit i.on { background:var(--c-accent); }

/* จุดสถานะ: เส้นทึบ/ประ + ระดับการเติม บอกสถานะโดยไม่ต้องดูสี */
.sdot { flex:none; width:10px; height:10px; border:1.5px solid var(--c-muted); display:block; }
.sdot--new    { border-color:var(--c-accent); border-style:solid; background:transparent; }
.sdot--work   { border-color:var(--c-ink); background:linear-gradient(135deg,var(--c-ink) 0 50%,transparent 50% 100%); }
.sdot--hold   { border-color:var(--c-accent-text); border-style:dashed; background:transparent; }
.sdot--done   { border-color:var(--c-faint); background:var(--c-faint); }

/* แถบ SLA — ราง hairline + ขีดเตือนที่ 80% (จุดที่นโยบายเริ่มแจ้งเตือนล่วงหน้า) */
.slabar { position:relative; height:3px; background:var(--c-hair-soft); box-shadow:inset 0 0 0 1px var(--c-hair-soft); overflow:hidden; }
.slabar > i { position:absolute; inset:0 auto 0 0; background:var(--c-muted); transition:width .6s cubic-bezier(.22,.61,.36,1); display:block; }
.slabar::after { content:''; position:absolute; top:-1px; bottom:-1px; left:80%; width:1px; background:var(--c-rail); opacity:.75; }
.slabar.warn > i { background:var(--c-accent-text); }
.slabar.crit > i { background:var(--c-accent); }
.slabar.done > i { background:var(--c-rail); }
.slabar.done::after { opacity:0; }

/* ═══════════════════════════════════════════════════════════════
   8. ตาราง — จังหวะแถวสม่ำเสมอ, หัวตารางแยกชั้นด้วยน้ำหนัก/ระยะ ไม่ใช่เส้นหนา,
      เส้นคั่นเป็น hairline จากแรมป์ neutral, คอลัมน์แรกตรึงเมื่อเลื่อนแนวนอน
   ═══════════════════════════════════════════════════════════════ */
.tbl-wrap { width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; }
.tbl { min-width:100%; font-size:var(--fs-body); }
.tbl thead th {
  position:sticky; top:0; z-index:2;
  background:var(--c-surface); color:var(--c-faint);
  font-family:'Archivo',sans-serif; font-size:var(--fs-micro); font-weight:600;
  letter-spacing:.12em; text-transform:uppercase; text-align:left;
  padding:.9rem .75rem .65rem; white-space:nowrap;
  border-bottom:1px solid var(--c-hair);
}
.tbl tbody tr { background:var(--c-card); transition:background-color .16s ease; }
.tbl tbody td { height:62px; padding:.7rem .75rem; border-bottom:1px solid var(--c-hair-soft); vertical-align:middle; line-height:1.5; }
.tbl tbody tr:last-child td { border-bottom:0; }
.tbl tbody tr.clickable { cursor:pointer; }
.tbl tbody tr.clickable:hover { background:var(--c-surface); }
.tbl tbody tr.is-active { background:var(--c-accent-soft); }
.tbl tbody tr.is-active td:first-child { box-shadow:inset 3px 0 0 0 var(--c-accent); }
/* ตัวเลขที่เทียบกันได้ ให้ชิดขวาและเรียงหลักตรงกัน */
.tbl th.rt, .tbl td.rt { text-align:right; font-variant-numeric:tabular-nums; }
/* คอลัมน์แรกตรึงไว้ตอนเลื่อนแนวนอน — บนจอแคบตารางกว้างเกินเสมอ */
.tbl-sticky thead th:first-child { position:sticky; left:0; z-index:3; }
.tbl-sticky tbody td:first-child { position:sticky; left:0; z-index:1; background:inherit; }
.tbl-sticky thead th:first-child, .tbl-sticky tbody td:first-child { box-shadow:1px 0 0 0 var(--c-hair-soft); }
.tbl-sticky tbody tr.is-active td:first-child { box-shadow:inset 3px 0 0 0 var(--c-accent), 1px 0 0 0 var(--c-hair-soft); }
/* หัวเรื่องในตารางยาวได้ไม่เกินสองบรรทัด เพื่อให้จังหวะแถวคงที่ */
.cell-title { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

/* ═══════════════════════════════════════════════════════════════
   9. เนวิเกชัน
   ═══════════════════════════════════════════════════════════════ */
.navitem {
  display:flex; align-items:center; gap:.7rem; width:100%;
  min-height:var(--tap); padding:.5rem .75rem .5rem 1.25rem;
  text-align:left; color:var(--c-muted); font-size:var(--fs-body); font-weight:500;
  border-left:3px solid transparent;
  transition:background-color .16s ease, color .16s ease, border-color .16s ease;
}
.navitem:hover { background:var(--c-bg); color:var(--c-ink); }
.navitem[aria-current="page"] {
  background:var(--c-accent-soft); color:var(--c-accent-soft-ink);
  border-left-color:var(--c-accent); font-weight:600;
}
.navitem .nb {
  margin-left:auto; font-family:'Archivo',sans-serif; font-size:var(--fs-fine); font-weight:600;
  min-width:22px; height:20px; padding:0 5px; display:grid; place-items:center;
  background:var(--c-surface); color:var(--c-muted); border:1px solid var(--c-hair);
}
.navitem[aria-current="page"] .nb { background:var(--c-accent-btn); color:var(--c-on-accent); border-color:transparent; }

/* bottom nav มือถือ */
.botnav {
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  display:grid; grid-auto-flow:column; grid-auto-columns:1fr;
  background:var(--c-card); border-top:1px solid var(--c-line);
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -8px 24px -18px rgba(0,0,0,.4);
}
.botnav button {
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  min-height:58px; padding:.35rem .25rem; font-size:var(--fs-micro); font-weight:600; color:var(--c-faint);
  border-top:2px solid transparent; transition:color .16s ease, border-color .16s ease;
}
.botnav button[aria-current="page"] { color:var(--c-accent-text); border-top-color:var(--c-accent); }

/* ═══════════════════════════════════════════════════════════════
   10. Overlay: drawer / modal / toast / sheet
   ═══════════════════════════════════════════════════════════════ */
.scrim {
  position:fixed; inset:0; z-index:50; background:rgba(22,21,20,.44);
  opacity:0; pointer-events:none; transition:opacity .2s ease;
  -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
}
.scrim.on { opacity:1; pointer-events:auto; }

.drawer {
  position:fixed; top:0; right:0; bottom:0; z-index:60;
  width:min(560px,100vw); display:flex; flex-direction:column;
  background:var(--c-bg); border-left:1px solid var(--c-line);
  box-shadow:var(--c-shadow-lift);
  transform:translateX(101%); transition:transform .24s cubic-bezier(.32,.72,0,1), visibility 0s linear .24s;
  visibility:hidden;
}
.drawer.on { transform:translateX(0); visibility:visible; transition-delay:0s; }

.sheet {
  position:fixed; left:0; right:0; bottom:0; z-index:60;
  max-height:82vh; overflow-y:auto;
  background:var(--c-bg); border-top:2px solid var(--c-ink);
  transform:translateY(101%); transition:transform .24s cubic-bezier(.32,.72,0,1), visibility 0s linear .24s;
  visibility:hidden; padding-bottom:env(safe-area-inset-bottom);
}
.sheet.on { transform:translateY(0); visibility:visible; transition-delay:0s; }

/* overlay ที่ปิดอยู่ต้อง inert จริง ๆ ไม่งั้นจะบังคลิกทั้งหน้าจอ */
.modal-wrap {
  position:fixed; inset:0; z-index:60; display:grid; place-items:center; padding:1rem;
  pointer-events:none; visibility:hidden; transition:visibility 0s linear .2s;
}
.modal-wrap.on { visibility:visible; transition-delay:0s; }
.modal {
  width:min(520px,100%); max-height:88vh; overflow-y:auto;
  background:var(--c-bg); border:1px solid var(--c-line); box-shadow:var(--c-shadow-lift);
  opacity:0; transform:translateY(10px) scale(.985); transition:opacity .19s ease, transform .19s cubic-bezier(.22,.61,.36,1);
}
.modal-wrap.on .modal { opacity:1; transform:none; pointer-events:auto; }

.toast {
  position:fixed; z-index:70; left:1rem; right:1rem; bottom:calc(58px + 1rem + env(safe-area-inset-bottom));
  display:flex; gap:.75rem; align-items:flex-start;
  padding:.85rem 1rem; background:var(--c-ink); color:var(--c-bg);
  border-left:3px solid var(--c-accent); box-shadow:var(--c-shadow-lift);
  font-size:var(--fs-sm); line-height:1.65;
  opacity:0; transform:translateY(12px); pointer-events:none;
  transition:opacity .2s ease, transform .2s cubic-bezier(.32,.72,0,1);
}
.toast.on { opacity:1; transform:none; pointer-events:auto; }
@media (min-width:1024px) {
  .toast { left:auto; right:1.5rem; bottom:1.5rem; max-width:440px; }
}

/* ═══════════════════════════════════════════════════════════════
   11. Motion — เข้าเนื้อหาแบบนุ่ม + skeleton ตอนสลับหน้า
   ═══════════════════════════════════════════════════════════════ */
@keyframes riseIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
.rise { animation:riseIn .2s cubic-bezier(.22,.61,.36,1) both; }
.rise-1 { animation-delay:.03s } .rise-2 { animation-delay:.06s } .rise-3 { animation-delay:.09s }

@keyframes shimmer { from { background-position:-180% 0 } to { background-position:280% 0 } }
.skel {
  background:linear-gradient(90deg,var(--c-surface) 0%,var(--c-hair) 45%,var(--c-surface) 90%);
  background-size:220% 100%; animation:shimmer 1.1s linear infinite;
}
@keyframes barGrow { from { transform:scaleX(0) } to { transform:scaleX(1) } }
.bargrow { transform-origin:left center; animation:barGrow .55s cubic-bezier(.22,.61,.36,1) both; }

/* โหมดมืด: แผงแบรนด์กับพื้นหน้าใกล้เคียงกัน จึงคั่นด้วย hairline ให้เส้นแบ่งดูตั้งใจ */
html.dark .login-hero { border-right:1px solid #444141; }

/* ลายเส้นทแยงบนแผงแบรนด์ฝั่งซ้ายหน้าเข้าสู่ระบบ */
.hatch {
  background-image:repeating-linear-gradient(-45deg, rgba(243,242,242,.055) 0 1px, transparent 1px 9px);
}
/* กรอบใส่โลโก้บริษัทบนแผงมืด — ขอบบางและมีระยะหายใจ ไม่แย่งสายตาจากหัวเรื่อง */
.logo-plate {
  display:flex; align-items:center; gap:1.1rem;
  padding:.95rem 1.1rem; background:#161514; border:1px solid #444141;
}
.logo-plate img { width:158px; flex:none; }
.logo-plate > div { padding-left:1.1rem; border-left:1px solid #444141; align-self:stretch; display:flex; flex-direction:column; justify-content:center; }
@media (max-width:400px) { .logo-plate { gap:.75rem; padding:.8rem .85rem; } .logo-plate img { width:110px; } .logo-plate > div { padding-left:.75rem; } }

/* timeline audit trail */
.tl { position:relative; padding-left:1.4rem; }
.tl::before { content:''; position:absolute; left:4px; top:6px; bottom:6px; width:1px; background:var(--c-rail); }
.tl-item { position:relative; padding-bottom:1.05rem; }
.tl-item:last-child { padding-bottom:0; }
.tl-item::before {
  content:''; position:absolute; left:-1.4rem; top:6px; width:9px; height:9px;
  background:var(--c-bg); border:1.5px solid var(--c-line);
}
.tl-item.hot::before { border-color:var(--c-accent); background:var(--c-accent); }

/* ซ่อน scrollbar แนวนอนของแถบชิป แต่ยังเลื่อนได้ */
.chiprow { display:flex; gap:.4rem; overflow-x:auto; scrollbar-width:none; padding-bottom:2px; }
.chiprow::-webkit-scrollbar { display:none; }
.chip {
  display:inline-flex; align-items:center; gap:.45rem; flex:none;
  min-height:36px; padding:0 .75rem; font-size:var(--fs-sm); font-weight:500;
  color:var(--c-ink); background:transparent; border:1px solid var(--c-hair);
  transition:background-color .16s ease, border-color .16s ease, color .16s ease, box-shadow .16s ease;
}
@media (pointer:coarse) { .chip { min-height:var(--tap); } }
.chip:hover { border-color:var(--c-line); background:var(--c-surface); }
.chip[aria-pressed="true"] { background:var(--c-ink); color:var(--c-bg); border-color:var(--c-ink); box-shadow:inset 0 -2px 0 0 rgba(0,0,0,.2); }
.chip .cn { font-family:'Archivo',sans-serif; font-size:var(--fs-micro); font-weight:600; opacity:.65; font-variant-numeric:tabular-nums; }
.chip[aria-pressed="true"] .cn { opacity:.85; }
.chip.dimmed { opacity:.45; }

/* สวิตช์เปิด/ปิดกฎ */
.sw { position:relative; width:42px; height:22px; flex:none; background:var(--c-hair); border:1px solid var(--c-line); transition:background-color .16s ease; }
.sw i { position:absolute; top:2px; left:2px; width:16px; height:16px; background:var(--c-bg); border:1px solid var(--c-line); box-shadow:0 1px 2px rgba(32,30,29,.28); transition:transform .16s cubic-bezier(.32,.72,0,1); display:block; }
.sw[aria-checked="true"] { background:var(--c-accent-btn); border-color:var(--c-accent-btn); }
.sw[aria-checked="true"] i { transform:translateX(20px); border-color:transparent; }

/* กราฟแท่ง */
.barrow:hover .barfill { filter:brightness(.92); }
.barfill { transition:filter .16s ease; }

/* การ์ดคลิกได้ */
.hovercard { transition:border-color .16s ease, box-shadow .16s ease, transform .16s ease; }
.hovercard:hover { border-color:var(--c-line); box-shadow:var(--c-shadow); transform:translateY(-1px); }

/* ป้องกัน content ชนกับ bottom nav บนมือถือ */
@media (max-width:1023px) { .pad-bottom-nav { padding-bottom:calc(58px + 1.5rem + env(safe-area-inset-bottom)); } }

/* ═══════════════════════════════════════════════════════════════
   11b. หน้าตั้งค่าระบบ (Admin Console)
        ฟอร์มเยอะมาก จึงต้องมีจังหวะที่อ่านออกเป็นกลุ่ม ๆ ไม่ใช่กองฟิลด์ยาว
        ใช้ token เดิมทั้งหมด — ไม่มีสีใหม่ ไม่มี gradient ไม่มีมุมโค้ง
   ═══════════════════════════════════════════════════════════════ */

/* แถบสรุปสถานะระบบด้านบน — ตารางบาง ๆ ที่คั่นด้วย hairline ไม่ใช่การ์ดลอย */
.setstat { display:grid; gap:1px; background:var(--c-hair); border:1px solid var(--c-hair); grid-template-columns:repeat(2,minmax(0,1fr)); }
@media (min-width:768px) { .setstat { grid-template-columns:repeat(4,minmax(0,1fr)); } }
.setstat > div { background:var(--c-card); padding:.85rem 1rem; min-width:0; }

/* กลุ่มฟิลด์ภายในแผงหมวด — คั่นด้วยเส้น "ภายใน" ไม่ใช่กรอบซ้อนกรอบ */
.setsec { padding:1.15rem 1.25rem; border-top:1px solid var(--c-hair-soft); }
.setsec:first-child { border-top:0; }
@media (min-width:640px) { .setsec { padding:1.35rem 1.5rem; } }
.setsec > .tbl-wrap { margin:0 -1.25rem; width:calc(100% + 2.5rem); }
@media (min-width:640px) { .setsec > .tbl-wrap { margin:0 -1.5rem; width:calc(100% + 3rem); } }

/* ฟอร์มสองคอลัมน์บนจอกว้าง — คอลัมน์เดียวเสมอบนมือถือ */
.setgrid { display:grid; gap:1rem 1.35rem; }
@media (min-width:900px) {
  .setgrid-2 { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .setgrid-3 { grid-template-columns:repeat(3,minmax(0,1fr)); }
}
.setgrid .span2 { grid-column:1 / -1; }

/* คำบอกว่าตารางเลื่อนแนวนอนได้ — ตารางตั้งค่าบางตัวกว้างกว่าแผงเสมอ ไม่ว่าจอกว้างแค่ไหน */

.setcards { display:grid; gap:.85rem; grid-template-columns:1fr; }
@media (min-width:640px) { .setcards { grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media (min-width:1280px) { .setcards { grid-template-columns:repeat(3,minmax(0,1fr)); } }
.setcard { background:var(--c-bg); border:1px solid var(--c-hair); padding:1rem 1.1rem; }

.swrow { display:flex; align-items:flex-start; gap:1rem; padding:.75rem 0; border-top:1px solid var(--c-hair-soft); }
.swrow:first-child { border-top:0; padding-top:0; }
.swrow:last-child { padding-bottom:0; }
.swrow > .sw { margin-top:1px; }

.tbl-tight tbody td { height:auto; padding:.6rem .7rem; }
.tbl-tight thead th { padding:.75rem .7rem .55rem; }
.tbl-tight .input { min-height:38px; padding:.35rem .55rem; }
@media (min-width:640px) { .tbl-tight .input { min-height:34px; font-size:var(--fs-body); } }
.tbl-tight select.input { padding-right:1.9rem; background-position:right .5rem center; }
.tbl-tight .btn-sm { min-height:32px; padding:0 .55rem; }

.dirty {
  display:inline-flex; align-items:center; gap:.4rem;
  font-family:'Archivo',sans-serif; font-size:var(--fs-micro); font-weight:600;

}

.cdot--ok   { background:var(--c-ink); border-color:var(--c-ink); }
.cdot--warn { background:transparent; border-color:var(--c-accent); border-style:dashed; }
.cdot--off  { background:transparent; border-style:dotted; }   /* ใช้ขอบ --c-line ของ .cdot เพื่อให้ผ่าน AA (rail จางเกิน) */

.setwarn { display:flex; gap:.75rem; align-items:flex-start; padding:.85rem 1rem; background:var(--c-accent-soft); color:var(--c-accent-soft-ink); border-left:3px solid var(--c-accent); }
.setwarn a, .setwarn strong { color:inherit; }

.robox { min-height:44px; padding:.6rem .8rem; background:var(--c-surface); border:1px solid var(--c-hair); color:var(--c-muted); font-size:var(--fs-body); display:flex; align-items:center; }

  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

// เวลาที่หน้าเว็บเริ่มทำงาน — ใช้เดินนาฬิกา SLA จริงตามเวลาที่ผ่านไป
const T0 = Date.now();
// เวลาปัจจุบันแบบ HH:MM — ใช้ประทับเวลาปิดงานที่เกิดขึ้นระหว่างใช้งานจริง
function nowHHMM() {
  const d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + ' น.';
}
const elapsedMin = () => (Date.now() - T0) / 60000;

// แปลงนาทีคงเหลือเป็นข้อความ (P3/P4 คิดเป็นวันทำการ 9 ชม./วัน)
function fmtRemain(m, asDays) {
  if (m <= 0) return 'เกินเป้าหมาย';
  if (asDays && m >= 540) return (m / BIZ_DAY_MIN).toFixed(1) + ' วันทำการ';
  const h = Math.floor(m / 60), mm = Math.floor(m % 60);
  if (h > 0) return h + ' ชม. ' + String(mm).padStart(2, '0') + ' น.';
  return Math.max(0, Math.floor(m)) + ' นาที';
}
/* แปลงจำนวนนาทีเป็นข้อความเป้าหมาย SLA ที่คนอ่านรู้เรื่อง
   biz = นับเฉพาะเวลาทำการ (9 ชม./วัน) — ใช้ตอนหน้าตั้งค่าแก้ค่า P1–P4 แล้วต้องสร้างข้อความใหม่ */
function slaLabel(min, biz, short) {
  const m = Math.max(1, Math.round(min));
  const unitH = biz ? (short ? ' ชม.ทำการ' : ' ชั่วโมงทำการ') : (short ? ' ชม.' : ' ชั่วโมง');
  if (biz && m >= BIZ_DAY_MIN) {
    const d = m / BIZ_DAY_MIN;
    return (d % 1 === 0 ? d : d.toFixed(1)) + ' วันทำการ';
  }
  if (m >= 60) { const h = m / 60; return (h % 1 === 0 ? h : h.toFixed(1)) + unitH; }
  return m + ' นาที';
}

// นับถอยหลังละเอียดระดับวินาที (ใช้ในแผงรายละเอียด)
function fmtClock(m) {
  if (m <= 0) return '00:00:00';
  const total = Math.floor(m * 60);
  const h = Math.floor(total / 3600), mi = Math.floor((total % 3600) / 60), s = total % 60;
  const p = n => String(n).padStart(2, '0');
  return p(h) + ':' + p(mi) + ':' + p(s);
}

/* คำนวณสถานะ SLA ของ Ticket หนึ่งรายการ
   — สถานะ "รอข้อมูลเพิ่ม" นาฬิกาหยุดชั่วคราว ตาม SLA ข้อ 5.4 (Pending User) */
function slaOf(t) {
  const p = PRIO(t.prio);
  if (t.status === 'ปิดงานแล้ว') {
    return { rem:0, pct:100, level:'done', paused:false,
      text:'ปิดงานแล้ว', clock:'—',
      note:'ปิดงานภายในเป้าหมาย SLA และส่งแบบประเมิน CSAT ให้ผู้แจ้งเรียบร้อย' };
  }
  const paused = t.status === 'รอข้อมูลเพิ่ม';
  const rem = paused ? t.slaMins : Math.max(0, t.slaMins - elapsedMin());
  const pct = Math.max(0, Math.min(100, 100 - (rem / t.totalMins) * 100));
  let level = 'ok';
  if (rem <= 0) level = 'breach';
  else if (pct >= 80) level = 'crit';
  else if (pct >= 60) level = 'warn';
  const note = paused
    ? 'นาฬิกา SLA หยุดชั่วคราว — รอข้อมูลจากผู้แจ้ง (Pending User) ตามข้อ 5.4 ของ AIDC-IT-SLA-001'
    : level === 'breach'
      ? 'เกินเป้าหมายเวลาแก้ไข — ระบบยกระดับไปยังหัวหน้าทีมและ Head of IT อัตโนมัติแล้ว'
      : level === 'crit'
        ? 'ใกล้ครบเป้าหมาย เหลือไม่ถึง 20% — แจ้งเตือนผู้รับผิดชอบทุก 5 นาทีผ่าน LINE OA และอีเมล'
        : level === 'warn'
          ? 'ใช้เวลาไปแล้วเกินครึ่งของเป้าหมายเวลาแก้ไข'
          : 'อยู่ในกรอบเป้าหมายเวลาแก้ไข ' + p.res;
  return { rem, pct, level, paused, text:fmtRemain(rem, p.resMin >= 1080), clock:fmtClock(rem), note };
}

// มาตรวัดความเร่งด่วน P1=4 ขีด … P4=1 ขีด — บอกระดับด้วยรูปทรง ไม่พึ่งสีอย่างเดียว
function meter(prioKey) {
  const n = PRIO(prioKey).rank;
  let h = '';
  for (let i = 1; i <= 4; i++) h += '<i class="' + (i <= n ? 'on' : '') + '"></i>';
  return '<span class="meter ' + (prioKey === 'P1' ? 'crit' : '') + '" aria-hidden="true">' + h + '</span>';
}
// ป้ายความเร่งด่วนเต็มรูปแบบ: มาตรวัด + รหัส + คำไทย
function prioTag(prioKey) {
  const p = PRIO(prioKey);
  const cls = prioKey === 'P1' ? 'tag-solid' : prioKey === 'P2' ? 'tag-soft' : 'tag-quiet';
  return '<span class="inline-flex items-center gap-2">' + meter(prioKey) +
    '<span class="tag ' + cls + '">' + p.key + ' · ' + p.th + '</span></span>';
}
// ตัวบ่งชี้สถานะ: จุดรูปทรงต่างกัน + ไอคอน + ข้อความ
const ST_META = {
  'รอรับเรื่อง':    { mod:'new',  icon:'clock' },
  'กำลังดำเนินการ': { mod:'work', icon:'play' },
  'รอข้อมูลเพิ่ม':  { mod:'hold', icon:'pause' },
  'ปิดงานแล้ว':     { mod:'done', icon:'check' }
};
function statusTag(st) {
  const m = ST_META[st] || ST_META['กำลังดำเนินการ'];
  const tone = st === 'ปิดงานแล้ว' ? 'text-faint' : st === 'รอรับเรื่อง' ? 'text-accent-text' : 'text-ink';
  return '<span class="inline-flex items-center gap-1.5 whitespace-nowrap ' + tone + '">' +
    ic(m.icon, 'w-4 h-4 flex-none') + '<span class="text-[13.5px] font-medium">' + esc(st) + '</span></span>';
}
// แถบ SLA ที่เดินจริง — ผูก data-sla ไว้ให้ tick อัปเดตทุกวินาที
function slaCell(t, withClock) {
  const s = slaOf(t);
  const cls = s.level === 'done' ? 'done' : s.level === 'ok' ? '' : (s.level === 'warn' ? 'warn' : 'crit');
  return '<div data-sla="' + t.id + '" class="min-w-[128px]">' +
    '<div class="flex items-baseline gap-1.5 whitespace-nowrap">' +
      '<span data-slatext class="num text-[13.5px] font-semibold ' +
        (s.level === 'breach' || s.level === 'crit' ? 'text-accent-text' : s.level === 'done' ? 'text-faint' : 'text-ink') + '">' +
        (withClock ? s.clock : s.text) + '</span>' +
      (s.paused ? '<span class="eyebrow">หยุดนับ</span>' : '') +
    '</div>' +
    '<div class="slabar ' + cls + ' mt-1.5"><i style="width:' + s.pct.toFixed(1) + '%"></i></div>' +
  '</div>';
}

function loginAccountFor(user) {
  const u = String(user || '').trim().toLowerCase().split('@')[0];
  if (!u) return null;
  return ACCOUNTS.find(a => a.mail.split('@')[0] === u) || null;
}
const lockLeft = () => Math.max(0, (S.login.lockUntil || 0) - Date.now());
function fmtLock(ms) {
  const t = Math.ceil(ms / 1000);
  return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
}

function fieldErr(id, msg) {
  if (!msg) return '';
  return '<p id="' + id + '" class="err-text" role="alert">' + ic('alert', '') + '<span>' + esc(msg) + '</span></p>';
}

function skeleton() {

    '<div class="grid grid-cols-2 lg:grid-cols-4 gap-4">' +
      [0,1,2,3].map(() => '<div class="skel h-[92px]"></div>').join('') + '</div>' +

    [0,1,2,3,4,5].map(() => '<div class="skel h-[58px]"></div>').join('') +
  '</div>';
}

function viewBody(view) {
  if (view === 'track') return trackView();
  if (view === 'history') return historyView();
  if (view === 'new') return newTicketView();
  if (view === 'dash') return dashView();
  if (view === 'assets') return assetsView();
  if (view === 'rules') return rulesView();
  if (view === 'settings') return settingsView();
  if (view === 'kb') return kbView();
  return listView();
}

/* ─────────────────────────── 8. หน้า: รายการ Ticket ─────────────────────────── */
function filteredRows() {
  let rows = visibleTickets();
  if (S.statusF !== 'all') rows = rows.filter(t => t.status === S.statusF);
  if (S.cf !== 'ALL') rows = rows.filter(t => t.company === S.cf);
  const q = S.q.trim().toLowerCase();
  if (q) rows = rows.filter(t => (t.title + t.id + t.cat + (t.asset || '')).toLowerCase().includes(q));
  return rows;
}

function listView() {
  const vis = visibleTickets();
  const rows = filteredRows();
  const countBy = st => vis.filter(t => st === 'all' ? true : t.status === st).length;
  const r = S.fresh ? ' rise' : '';

  // ชิปบริษัทในเครือ
  const chips = [{ code:'ALL', name:'ทุกบริษัท' }].concat(activeCO()).map(c => {
    const n = c.code === 'ALL' ? vis.length : vis.filter(x => x.company === c.code).length;
    const inScope = c.code === 'ALL' || n > 0 || canWorkTickets();
    return '<button data-act="cf" data-code="' + c.code + '" class="chip' + (inScope ? '' : ' dimmed') + '" aria-pressed="' + (S.cf === c.code ? 'true' : 'false') + '">' +
      esc(c.name) + '<span class="cn">' + n + '</span></button>';
  }).join('');

  const statusChips = ['all'].concat(STATUSES).map(st =>
    '<button data-act="sf" data-st="' + esc(st) + '" class="chip" aria-pressed="' + (S.statusF === st ? 'true' : 'false') + '">' +
      (st === 'all' ? 'ทั้งหมด' : esc(st)) + '<span class="cn">' + countBy(st) + '</span></button>').join('');

  const empty =

  '</div>';

  // ตารางสำหรับ md ขึ้นไป
  const table =

    '<div class="tbl-wrap">' +
      '<table class="tbl tbl-sticky"><thead><tr>' +
        '<th>Ticket</th><th class="min-w-[260px]">เรื่อง</th><th>บริษัท</th><th>ระดับ</th>' +

          '<td><div class="cell-title font-medium leading-snug">' + esc(t.title) + '</div>' +

      '<span>' + esc(
        isEmp()
          ? 'ขอบเขตการมองเห็น: ผู้ใช้งานทั่วไปเห็นเฉพาะ Ticket ที่ตนเองแจ้ง (Data Isolation)'

   ประวัติการแจ้ง      = เรื่องที่ปิดแล้ว · เน้นวันที่ปิด คะแนน CSAT ที่เคยให้ และการเปิดเรื่องซ้ำ

// ความคืบหน้าล่าสุดของ Ticket หนึ่งรายการ (รายการบนสุดของ audit trail)
function lastMove(t) {
  const tl = timelineOf(t);
  return tl[0] || { what:'—', who:'—', when:'' };
}
// ดาว CSAT ที่ผู้ใช้เคยให้ — 0 = ยังไม่ได้ประเมิน
function csatStars(n) {
  if (!n) return '<span class="text-[12.5px] text-faint whitespace-nowrap">ยังไม่ได้ประเมิน</span>';
  let h = '';
  for (let i = 1; i <= 5; i++) {
    h += '<span class="' + (i <= n ? 'text-accent-text' : 'text-hair') + '">' +
      ic('star', 'w-[13px] h-[13px] flex-none', i <= n ? 2.2 : 1.4) + '</span>';
  }
  return '<span class="inline-flex items-center gap-1.5 whitespace-nowrap">' +
    '<span class="inline-flex items-center gap-0.5">' + h + '</span>' +
    '<span class="num text-[12.5px] font-semibold">' + n + '/5</span></span>';
}

  return '<div class="flex flex-col gap-5' + r + '">' + summary + (rows.length ? table + cards : empty) +

/* ─────────────────────────── 9. หน้า: แจ้งเรื่องใหม่ ─────────────────────────── */

// ผู้ช่วย AI ค้นคู่มือจากข้อความที่พิมพ์แบบ real-time
function aiHits() {
  const txt = (S.form.title + ' ' + S.form.desc).toLowerCase();
  if (txt.trim().length < 8) return [];
  return KB.filter(a => a.keys.some(k => txt.includes(k.toLowerCase()))).slice(0, 2);
}
/* กฎ routing ที่ตรงกับฟอร์มปัจจุบัน — กฎที่ถูกปิดในหน้าตั้งค่าจะไม่ถูกเลือก
   ทำให้ผลของ "ปิด/เปิดกฎ" เห็นได้ทันทีในแผง Auto Routing ของฟอร์มแจ้งเรื่อง */
function ruleForForm() {
  const cat = S.form.cat;
  let i = -1;
  if (cat.indexOf('เครื่องจักร') === 0) i = 0;
  else if (cat.indexOf('สิทธิ์') === 0) i = 1;
  else if (cat.indexOf('ระบบ POS') === 0) i = 2;
  else if (cat.indexOf('ERP') === 0) i = 3;
  else if (cat.indexOf('GPS') === 0) i = 4;
  if (i >= 0 && RULES[i] && RULES[i].on) return RULES[i];
  return {
    cond: i >= 0 ? 'ไม่มีกฎเฉพาะที่เปิดใช้อยู่ — ใช้กฎตั้งต้นของ Service Desk'
                 : CONAME(S.form.company) + ' + ' + S.form.dept + ' + ' + cat,
    team:'Central IT — Service Desk', mode:'Round-Robin', prio:S.form.prio
  };
}

        { k:'Auto Escalation', t:'ไม่มีผู้รับเรื่องใน 15 นาที', b:'Ticket ระดับ P1 ที่ไม่มีผู้รับจะถูกดันขึ้นหัวหน้าทีมของบริษัทนั้น และหากยังไม่มีผู้รับอีก 15 นาที จะดันต่อไปที่ Head of IT' },
        { k:'Cross-Company', t:'ส่งต่อข้ามบริษัทในเครือ', b:'Ticket ที่เกี่ยวเนื่องหลายบริษัทส่งต่อได้โดยคงประวัติเดิมทั้งหมด นาฬิกา SLA เริ่มนับใหม่ตามเงื่อนไขของบริษัทผู้รับ' }
      ].map(c =>
        '<article class="panel p-5">' +
          '<div class="eyebrow eyebrow-accent">' + esc(c.k) + '</div>' +
          '<h3 class="display-md mt-2 leading-snug">' + esc(c.t) + '</h3>' +

  return '<div class="flex flex-col gap-5' + r + '">' + rulesTable + matrix + escal + '</div>';
}

/* ═════════════════════ 12b. หน้า: ตั้งค่าระบบ (Admin Console) ═════════════════════
   สถาปัตยกรรมเดียวกับส่วนอื่นของแอป: ไม่มี state ซ้อน ไม่มีระบบใหม่
   — ทุกหมวดมี "ร่าง" (draft) ของตัวเอง แก้ในร่างก่อน แล้วกดบันทึกจึงมีผลกับข้อมูลจริง
   — ปุ่มยกเลิกทิ้งร่างนั้นทิ้ง ค่ากลับไปเท่ากับที่บันทึกล่าสุด
   — บันทึกแล้วผลจะไปถึงหน้าอื่นทันที (ชิปบริษัท / ฟอร์มแจ้งเรื่อง / แถบ SLA / Auto Routing)
   ═══════════════════════════════════════════════════════════════════════════════ */

const clone = o => JSON.parse(JSON.stringify(o));

/* คลังข้อมูลของแต่ละหมวด: live() = ถ่ายสำเนาค่าปัจจุบัน · apply() = เขียนกลับเข้าระบบจริง */
const SECSTORE = {
  co: {
    live: () => clone(CO),
    apply: d => { CO.length = 0; d.forEach(x => CO.push(x)); syncFormScope(); }
  },
  user: {
    live: () => ({ list:clone(USERS), admap:clone(ADMAP) }),
    apply: d => { USERS.length = 0; d.list.forEach(x => USERS.push(x)); ADMAP.length = 0; d.admap.forEach(x => ADMAP.push(x)); }
  },
  role: {
    live: () => ({ roles:clone(ROLES), rbac:clone(RBAC) }),
    apply: d => {
      ROLES.length = 0; d.roles.forEach(x => ROLES.push(x));
      Object.keys(RBAC).forEach(k => delete RBAC[k]);
      Object.assign(RBAC, clone(d.rbac));
    }
  },
  cat: {
    live: () => clone(CATS),
    apply: d => { Object.keys(CATS).forEach(k => delete CATS[k]); Object.assign(CATS, clone(d)); syncFormScope(); }
  },
  sla: {
    live: () => ({
      p: PRIOS.map(p => ({ key:p.key, respMin:p.respMin, resMin:p.resMin, mode:p.mode, report:p.report })),
      cal: clone(BIZCAL), hol: clone(HOLIDAYS), pause: clone(PAUSE), mw: clone(MAINTW)
    }),
    apply: applySla
  },
  rt: {
    live: () => ({ list:clone(RULES) }),
    apply: d => { RULES.length = 0; d.list.forEach(x => { x.cond = condText(x); RULES.push(x); }); }
  },
  team: {
    live: () => ({ teams:clone(TEAMS), oncall:clone(ONCALL), esc:clone(ESCCONTACT) }),
    apply: d => {
      TEAMS.length = 0; d.teams.forEach(x => TEAMS.push(x));
      ONCALL.length = 0; d.oncall.forEach(x => ONCALL.push(x));
      ESCCONTACT.length = 0; d.esc.forEach(x => ESCCONTACT.push(x));
    }
  },
  noti: {
    live: () => ({ ch:clone(NOTICH), rules:clone(NOTIRULES), tmpl:clone(NOTITMPL) }),
    apply: d => {
      NOTICH.length = 0; d.ch.forEach(x => NOTICH.push(x));
      NOTIRULES.length = 0; d.rules.forEach(x => NOTIRULES.push(x));
      Object.assign(NOTITMPL, d.tmpl);
    }
  },
  chan: {
    live: () => ({ list:clone(CHAN) }),
    apply: d => { CHAN.length = 0; d.list.forEach(x => CHAN.push(x)); }
  },
  sec:  { live: () => clone(SECU), apply: d => Object.assign(SECU, d) },
  intg: {
    live: () => ({ list:clone(INTG) }),
    apply: d => { INTG.length = 0; d.list.forEach(x => INTG.push(x)); }
  },
  sys:  { live: () => clone(SYS), apply: d => Object.assign(SYS, d) }
};

const DRAFTS = {};
function draftOf(sec) { if (!DRAFTS[sec]) DRAFTS[sec] = SECSTORE[sec].live(); return DRAFTS[sec]; }
function viewOf(sec) { return DRAFTS[sec] || SECSTORE[sec].live(); }
const isDirty = sec => Object.prototype.hasOwnProperty.call(DRAFTS, sec);
const secLabel = k => (SECS.find(s => s.k === k) || {}).label || k;

// อ่าน/เขียนค่าตาม path แบบ 'list.2.name' — ใช้ผูกทุกช่องกรอกในหน้านี้เข้ากับร่างด้วย handler เดียว
function getPath(o, p) { return p.split('.').reduce((a, k) => (a == null ? a : a[k]), o); }
function setPath(o, p, v) {
  const ks = p.split('.');
  const last = ks.pop();
  const t = ks.reduce((a, k) => a[k], o);
  t[last] = v;
}

/* เมื่อบริษัทถูกปิดใช้งานหรือหมวดหมู่ถูกลบ ต้องดึงฟอร์มและตัวกรองกลับมาอยู่ในค่าที่ยังมีอยู่จริง */
function syncFormScope() {
  const act = activeCO();
  if (!act.length) return;
  if (!act.some(c => c.code === S.form.company)) {
    S.form.company = act[0].code; S.form.asset = ''; S.form.gps = '';
  }
  const cats = catsOf(S.form.company);
  if (!cats.some(c => c.n === S.form.cat)) S.form.cat = cats[0] ? cats[0].n : '';
  S.form.prio = catCfg(S.form.company, S.form.cat).prio || S.form.prio;
  if (S.cf !== 'ALL' && !act.some(c => c.code === S.cf)) S.cf = 'ALL';
  if (S.set.catco && !CATS[S.set.catco]) S.set.catco = act[0].code;
}

/* บันทึกค่า SLA ใหม่ → สร้างข้อความเป้าหมายใหม่ และคำนวณเวลาคงเหลือของ Ticket ที่ยังเปิดอยู่ใหม่
   ใช้หลัก "เวลาที่ใช้ไปแล้วคงเดิม เป้าหมายเปลี่ยน" → คงเหลือ = เป้าหมายใหม่ − เวลาที่ใช้ไปแล้ว */
function applySla(d) {
  d.p.forEach(x => {
    const p = PRIO(x.key);
    const respMin = Math.max(1, +x.respMin || p.respMin);
    const resMin = Math.max(1, +x.resMin || p.resMin);
    const biz = x.mode === 'business';
    p.respMin = respMin; p.resMin = resMin; p.mode = x.mode; p.report = x.report;
    p.resp = slaLabel(respMin, biz) + (biz ? '' : ' (24×7)');
    p.res = slaLabel(resMin, biz) + (biz ? '' : ' (นับต่อเนื่อง)');
    p.respShort = slaLabel(respMin, biz, true);
    p.resShort = slaLabel(resMin, biz, true);
    p.clock = biz
      ? 'นับเฉพาะเวลาทำการ จ–ศ ' + d.cal.from + '–' + d.cal.to
      : 'นับต่อเนื่อง 24×7 · มีทีม On-call นอกเวลาทำการ';
    allTickets().forEach(t => {
      if (t.prio !== x.key || t.status === 'ปิดงานแล้ว') return;
      const used = Math.max(0, t.totalMins - t.slaMins);
      t.totalMins = resMin;
      t.slaMins = Math.max(0, resMin - used);
    });
  });
  Object.assign(BIZCAL, d.cal);
  HOLIDAYS.length = 0; d.hol.forEach(h => HOLIDAYS.push(h));
  PAUSE.length = 0; d.pause.forEach(p => PAUSE.push(p));
  Object.assign(MAINTW, d.mw);
}

// ข้อความเงื่อนไขของกฎ routing ที่สร้างจากตัวสร้างเงื่อนไข
function condText(r) {
  return (r.co === 'ALL' ? 'ทุกบริษัท' : CONAME(r.co)) + ' + ' + (r.dept || 'ทุกแผนก') +
    ' + ' + (r.cat || 'ทุกหมวดหมู่') + ' + ' + (r.urg || 'ทุกระดับ');
}

// ข้อความบอกผลที่เกิดขึ้นจริงหลังกดบันทึกในแต่ละหมวด
function saveNote(sec) {
  const n = {
    co:'ชิปบริษัทในหน้าคิวงานและตัวเลือกบริษัทในฟอร์มแจ้งเรื่องอัปเดตตามแล้ว',
    user:'สิทธิ์ใหม่จะมีผลกับผู้ใช้ในการเข้าสู่ระบบครั้งถัดไป',

    sla:'แถบ SLA และเวลาคงเหลือของ Ticket ที่ยังเปิดอยู่คำนวณใหม่แล้ว',
    rt:'แผง Auto Routing ในฟอร์มแจ้งเรื่องใช้กฎชุดใหม่แล้ว',
    team:'ตารางเวร on-call และผู้รับ escalation อัปเดตแล้ว',
    noti:'กฎการแจ้งเตือนชุดใหม่มีผลกับเหตุการณ์ถัดไป',
    chan:'ช่องทางรับแจ้งที่ปิดไว้จะไม่สร้าง Ticket ใหม่อีก',
    sec:'นโยบายรหัสผ่านและ session มีผลกับการเข้าสู่ระบบครั้งถัดไป',
    intg:'การตั้งค่าการเชื่อมต่อถูกบันทึกแล้ว',

  };
  return (n[sec] || 'บันทึกแล้ว') + ' · บันทึกใน Audit Log โดย ' + me().name;

function saveSec(sec) {
  if (!isDirty(sec)) { say('ยังไม่มีการแก้ไขในหมวดนี้ — ไม่มีอะไรต้องบันทึก'); return; }
  SECSTORE[sec].apply(DRAFTS[sec]);
  delete DRAFTS[sec];
  paint();
  say('บันทึกหมวด "' + secLabel(sec) + '" เรียบร้อย — ' + saveNote(sec));
}

/* เพิ่ม / ลบแถวในตารางของแต่ละหมวด (ทำงานบนร่างเสมอ) */
function secAdd(sec, what) {
  const d = draftOf(sec);
  const mine = 'HQ';
  if (sec === 'co') {
    d.push({ code:'NEW' + (d.length + 1), name:'บริษัทใหม่', users:0, domain:'', from:'08:30', to:'17:30', active:true });
    say('เพิ่มแถวบริษัทใหม่ในร่างแล้ว — กรอกรหัสและชื่อ แล้วกดบันทึก');
  } else if (sec === 'user') {
    d.list.unshift({ name:'ผู้ใช้ใหม่', mail:'', co:mine, dept:'', role:'employee', ad:'AIDC-ALL-EMPLOYEES', on:true, locked:false, last:'ยังไม่เคยเข้าใช้' });
  } else if (sec === 'role') {
    const k = 'custom_role_' + (d.roles.length + 1);
    d.roles.push({ k:k, label:'บทบาทใหม่', en:k, n:0, sys:false });
    d.rbac[k] = { 'ticket.view.own':true, 'ticket.create':true };
  } else if (sec === 'cat') {
    const co = S.set.catco;
    if (!d[co]) d[co] = [];
    d[co].push({ n:'หมวดหมู่ใหม่', itam:false, gps:false, prio:'P3' });
  } else if (sec === 'sla') {
    d.hol.push({ d:'2569-00-00', n:'วันหยุดใหม่' });
  } else if (sec === 'rt') {
    d.list.push({ on:true, co:'ALL', dept:'ทุกแผนก', cat:'ทุกหมวดหมู่', urg:'เร่งด่วนปานกลาง',
      cond:'', team:'Central IT — Service Desk', mode:'Round-Robin', prio:'P3' });
  } else if (sec === 'team' && what === 'oncall') {
    d.oncall.push({ week:'', main:'', backup:'', tel:'', now:false });
  } else if (sec === 'noti') {
    d.rules.push({ ev:'เหตุการณ์ใหม่', to:'', email:true, teams:false, line:false, inapp:true });
  }
}
function secDel(sec, what, i) {
  const d = draftOf(sec);
  if (sec === 'co') d.splice(i, 1);
  else if (sec === 'user') d.list.splice(i, 1);
  else if (sec === 'cat') d[S.set.catco].splice(i, 1);
  else if (sec === 'sla') d.hol.splice(i, 1);
  else if (sec === 'rt') d.list.splice(i, 1);
  else if (sec === 'team') d.oncall.splice(i, 1);
  else if (sec === 'noti') d.rules.splice(i, 1);
}

/* ─────────── ตัวช่วยวาดฟอร์ม — สไตล์เดียวกันทั้ง 12 หมวด ─────────── */
const fid = (sec, path) => 'st-' + sec + '-' + path.replace(/[^a-zA-Z0-9]/g, '_');

function setHead(t, d) {
  return '<div class="mb-3.5"><h3 class="display-sm">' + esc(t) + '</h3>' +
    (d ? '<p class="text-[12.5px] text-faint leading-relaxed mt-1 max-w-[74ch]">' + esc(d) + '</p>' : '') + '</div>';
}
function setBlock(t, d, body) { return '<section class="setsec">' + setHead(t, d) + body + '</section>'; }

/* ช่องกรอกที่ผูกกับ path ในร่างของหมวด
   o.bare = อยู่ในตารางจึงไม่มีป้ายกำกับให้เห็น แต่ยังมี aria-label ให้โปรแกรมอ่านหน้าจอ (ค่าเป็นคลาสความกว้าง)
   o.span = กินสองคอลัมน์ · o.num = ตัวเลข · o.ro = ปิดตามสิทธิ์ · o.hint = คำอธิบายใต้ช่อง */
function fWrap(o, label, id, inner) {
  if (o.bare) return '<div class="field ' + o.bare + '">' + inner + '</div>';
  return '<div class="field' + (o.span ? ' span2' : '') + '">' +
    '<label for="' + id + '">' + esc(label) + '</label>' + inner +
    (o.hint ? '<p class="text-[11.5px] text-faint leading-relaxed">' + esc(o.hint) + '</p>' : '') + '</div>';
}
function fIn(sec, path, label, val, o) {
  o = o || {};
  const id = fid(sec, path);
  return fWrap(o, label, id,
    '<input id="' + id + '" data-fkey="' + id + '" data-act="' + (o.num ? 'setn' : 'setf') + '" ' +
      'data-sec="' + sec + '" data-path="' + esc(path) + '" class="input"' +
      (o.num ? ' type="number" inputmode="numeric" min="0"' : ' type="text"') +
      (o.bare ? ' aria-label="' + esc(label) + '"' : '') +
      (o.ro ? ' disabled' : '') + ' value="' + esc(val) + '">');
}
// select ที่ผูกกับ path — opts เป็น array ของสตริง หรือ [value, label]
function fSel(sec, path, label, val, opts, o) {
  o = o || {};
  const id = fid(sec, path);
  return fWrap(o, label, id,
    '<select id="' + id + '" data-fkey="' + id + '" data-act="setf" data-sec="' + sec + '" data-path="' + esc(path) + '" ' +
      'class="input"' + (o.bare ? ' aria-label="' + esc(label) + '"' : '') + (o.ro ? ' disabled' : '') + '>' +
      opts.map(x => {
        const v = Array.isArray(x) ? x[0] : x, l = Array.isArray(x) ? x[1] : x;
        return '<option value="' + esc(v) + '"' + (String(v) === String(val) ? ' selected' : '') + '>' + esc(l) + '</option>';
      }).join('') +
    '</select>');
}
function fTa(sec, path, label, val, o) {
  o = o || {};
  const id = fid(sec, path);
  return '<div class="field span2">' +
    '<label for="' + id + '">' + esc(label) + '</label>' +
    '<textarea id="' + id + '" data-fkey="' + id + '" data-act="setf" data-sec="' + sec + '" data-path="' + esc(path) + '" ' +
      'class="input"' + (o.ro ? ' disabled' : '') + (o.tall ? ' style="min-height:170px"' : '') + '>' + esc(val) + '</textarea>' +
    (o.hint ? '<p class="text-[11.5px] text-faint leading-relaxed">' + esc(o.hint) + '</p>' : '') +
  '</div>';
}
// สวิตช์เต็มแถว: ป้าย + คำอธิบายซ้าย สวิตช์ชิดขวา
function fSw(sec, path, title, desc, on, ro, act) {
  return '<div class="swrow">' +
    '<span class="min-w-0 flex-1">' +
      '<span class="block text-[13.5px] font-semibold leading-snug">' + esc(title) + '</span>' +
      (desc ? '<span class="block text-[12.5px] text-faint leading-relaxed mt-0.5">' + esc(desc) + '</span>' : '') +
    '</span>' +
    '<button data-act="' + (act || 'setsw') + '" data-sec="' + sec + '" data-path="' + esc(path) + '" class="sw" role="switch" ' +
      'aria-checked="' + (on ? 'true' : 'false') + '" aria-label="' + esc((on ? 'ปิด' : 'เปิด') + title) + '"' + (ro ? ' disabled' : '') + '><i></i></button>' +
  '</div>';
}
// สวิตช์ขนาดเล็กในตาราง
function swCell(sec, path, on, ro, label, act) {
  return '<button data-act="' + (act || 'setsw') + '" data-sec="' + sec + '" data-path="' + esc(path) + '" class="sw" role="switch" ' +
    'aria-checked="' + (on ? 'true' : 'false') + '" aria-label="' + esc(label || 'สลับค่า') + '"' + (ro ? ' disabled' : '') + '><i></i></button>';
}
// กล่องแสดงค่าที่ระบบคำนวณเอง แก้ด้วยมือไม่ได้
function roBox(label, val, hint) {
  return '<div class="field"><span class="lbl">' + esc(label) + '</span>' +
    '<div class="robox num">' + esc(val) + '</div>' +
    (hint ? '<p class="text-[11.5px] text-faint leading-relaxed">' + esc(hint) + '</p>' : '') + '</div>';
}
function delBtn(sec, what, i, label, ro) {
  return '<button data-act="setdel" data-sec="' + sec + '" data-what="' + (what || '') + '" data-i="' + i + '" ' +
    'class="btn btn-secondary btn-sm" aria-label="' + esc('ลบ ' + label) + '"' + (ro ? ' disabled' : '') + '>' +
    ic('trash', 'w-4 h-4') + '</button>';
}
// ตารางตั้งค่าบางตัวกว้างกว่าแผงเสมอ — บอกให้ชัดว่าเลื่อนดูคอลัมน์ที่เหลือได้ (คอลัมน์แรกตรึงไว้แล้ว)
function tblHint(mobileOnly) {
  return '<p class="tbl-hint' + (mobileOnly ? ' lg:hidden' : '') + '">' + ic('arrowR') +
    'เลื่อนตารางแนวนอนเพื่อดูคอลัมน์ที่เหลือ — คอลัมน์แรกตรึงไว้ให้อ้างอิงได้ตลอด</p>';
}
function addBtn(sec, what, label, ro) {
  return '<button data-act="setadd" data-sec="' + sec + '" data-what="' + (what || '') + '" class="btn btn-secondary btn-sm"' +
    (ro ? ' disabled' : '') + '>' + ic('plus', 'w-4 h-4') + esc(label) + '</button>';
}

/* แถบอธิบายสิทธิ์ของหมวดที่กำลังเปิดอยู่ — ไม่ซ่อนเงียบ ๆ ต้องบอกเหตุผล */
/* ─────────── 1. บริษัทในเครือ ─────────── */
function secCo(perm) {
  const d = viewOf('co');
  const openOf = code => allTickets().filter(t => t.company === code && t.status !== 'ปิดงานแล้ว').length;
  const rows = d.map((c, i) => {
    const ro = !rowEditable(perm);
    return '<tr' + (c.active ? '' : ' class="opacity-60"') + '>' +
      '<td>' + fIn('co', i + '.code', 'รหัสบริษัท', c.code, { ro:ro, bare:'w-[76px]' }) + '</td>' +
      '<td>' + fIn('co', i + '.name', 'ชื่อบริษัท', c.name, { ro:ro, bare:'min-w-[164px]' }) + '</td>' +
      '<td class="rt num whitespace-nowrap"><div>' + c.users.toLocaleString() + '</div>' +
        '<div class="text-[11.5px] text-faint">เปิดอยู่ ' + openOf(c.code) + '</div></td>' +
      '<td><div class="flex items-center gap-1 whitespace-nowrap">' +
        fIn('co', i + '.from', 'เวลาเริ่มงานของ ' + c.name, c.from, { ro:ro, bare:'w-[72px]' }) +
        '<span class="text-faint">–</span>' +
        fIn('co', i + '.to', 'เวลาเลิกงานของ ' + c.name, c.to, { ro:ro, bare:'w-[72px]' }) +
      '</div></td>' +
      '<td>' + fIn('co', i + '.domain', 'โดเมนอีเมล', c.domain, { ro:ro, bare:'min-w-[148px]' }) + '</td>' +
      '<td><div class="flex items-center gap-2 whitespace-nowrap">' +
        '<button data-act="askco" data-i="' + i + '" class="sw" role="switch" aria-checked="' + (c.active ? 'true' : 'false') + '" ' +
          'aria-label="' + esc((c.active ? 'ปิดใช้งาน ' : 'เปิดใช้งาน ') + c.name) + '"' + (ro ? ' disabled' : '') + '><i></i></button>' +
        '<span class="text-[12.5px] ' + (c.active ? 'text-ink' : 'text-faint') + '">' + (c.active ? 'เปิด' : 'ปิด') + '</span>' +
      '</div></td>' +
    '</tr>';
  }).join('');

  return setBlock('ทะเบียนบริษัทในเครือ',
    'ปิดใช้งานบริษัทใดก็ตาม ชิปของบริษัทนั้นจะหายจากหน้าคิวงานและจากตัวเลือกในฟอร์มแจ้งเรื่องทันทีที่กดบันทึก — ' +
    'Ticket เดิมยังอยู่ครบเพื่อการตรวจสอบย้อนหลัง · เวลาทำการตั้งต้นคือ จ.–ศ. 08:30–17:30 ตามปฏิทินกลาง',
    '<div class="tbl-wrap"><table class="tbl tbl-tight tbl-sticky"><thead><tr>' +
      '<th>รหัส</th><th class="min-w-[164px]">ชื่อบริษัท</th><th class="rt">ผู้ใช้ / Ticket</th>' +
      '<th class="min-w-[160px]">เวลาทำการ</th><th class="min-w-[148px]">โดเมนอีเมล</th><th>สถานะ</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table></div>' + tblHint(true) +
    '<div class="mt-4 flex flex-wrap items-center gap-3">' +
      addBtn('co', '', 'เพิ่มบริษัทในเครือ', perm !== 'edit') +
      '<span class="text-[11.5px] text-faint leading-relaxed flex-1 min-w-[220px]">' +
        'เปิดใช้งานอยู่ ' + activeCO().length + ' จาก ' + CO.length + ' บริษัท · รวมผู้ใช้ ' +
        CO.reduce((s, c) => s + c.users, 0).toLocaleString() + ' บัญชี' +
        (perm === 'edit' ? '' : ' · เพิ่มบริษัทใหม่ได้เฉพาะ Central IT') + '</span>' +
    '</div>');
}

/* ─────────── 2. ผู้ใช้และสิทธิ์ ─────────── */
function secUser(perm) {
  const d = viewOf('user');
  const q = S.set.uq.trim().toLowerCase();
  const list = d.list.map((u, i) => ({ u:u, i:i })).filter(x =>
    (S.set.uco === 'ALL' || x.u.co === S.set.uco) &&
    (S.set.urole === 'ALL' || x.u.role === S.set.urole) &&
    (!q || (x.u.name + x.u.mail + x.u.dept + x.u.ad).toLowerCase().includes(q)));

  const coChips = [['ALL', 'ทุกบริษัท']].concat(CO.map(c => [c.code, c.name])).map(c =>
    '<button data-act="setpick" data-k="uco" data-v="' + c[0] + '" class="chip" aria-pressed="' + (S.set.uco === c[0] ? 'true' : 'false') + '">' +
      esc(c[1]) + '</button>').join('');
  const roleChips = [['ALL', 'ทุกบทบาท']].concat(ROLES.map(r => [r.k, r.label])).map(r =>
    '<button data-act="setpick" data-k="urole" data-v="' + r[0] + '" class="chip" aria-pressed="' + (S.set.urole === r[0] ? 'true' : 'false') + '">' +
      esc(r[1]) + '</button>').join('');

  const rows = list.map(x => {
    const u = x.u, i = x.i, ro = !rowEditable(perm);
    return '<tr' + (u.on ? '' : ' class="opacity-60"') + '>' +
      '<td><div class="font-medium leading-snug">' + esc(u.name) + '</div>' +
        '<div class="text-[11.5px] text-faint">' + esc(u.mail || 'ยังไม่ระบุอีเมล') + '</div></td>' +
      '<td class="whitespace-nowrap"><div class="text-[13.5px]">' + esc(CONAME(u.co)) + '</div>' +
        '<div class="text-[11.5px] text-faint">' + esc(u.dept || '—') + '</div></td>' +
      '<td>' + fSel('user', 'list.' + i + '.role', 'บทบาทของ ' + u.name, u.role, ROLES.map(r => [r.k, r.label]), { ro:ro, bare:'min-w-[146px]' }) + '</td>' +
      '<td class="text-[12.5px] text-faint"><span class="block max-w-[124px] truncate" title="' + esc(u.ad) + '">' + esc(u.ad) + '</span></td>' +
      '<td><div class="flex items-center gap-2 whitespace-nowrap">' +
        swCell('user', 'list.' + i + '.on', u.on, ro, (u.on ? 'ปิดใช้งาน ' : 'เปิดใช้งาน ') + u.name) +
        (u.locked ? '<span class="tag tag-soft">' + ic('lock') + 'ล็อก</span>' : '') +
      '</div>' +
      '<div class="num text-[11.5px] text-faint whitespace-nowrap mt-1">' + esc(u.last) + '</div></td>' +
      '<td><div class="flex items-center gap-1.5 whitespace-nowrap">' +
        '<button data-act="setpw" data-n="' + esc(u.name) + '" class="btn btn-secondary btn-sm" ' +
          'title="รีเซ็ตรหัสผ่าน" aria-label="' + esc('รีเซ็ตรหัสผ่านของ ' + u.name) + '"' + (ro ? ' disabled' : '') + '>' +
          ic('key', 'w-4 h-4') + '</button>' +
        (u.locked ? '<button data-act="setunlock" data-m="' + esc(u.mail) + '" data-n="' + esc(u.name) + '" class="btn btn-secondary btn-sm" ' +
          'title="ปลดล็อกบัญชี" aria-label="' + esc('ปลดล็อกบัญชีของ ' + u.name) + '"' + (ro ? ' disabled' : '') + '>' + ic('lock', 'w-4 h-4') + '</button>' : '') +
        delBtn('user', '', i, u.name, ro) +
      '</div></td>' +
    '</tr>';
  }).join('');

  const adRows = d.admap.map((a, i) =>
    '<tr>' +
      '<td class="font-medium whitespace-nowrap">' + esc(a.g) + '</td>' +
      '<td>' + fSel('user', 'admap.' + i + '.role', 'บทบาท', a.role, ROLES.map(r => [r.k, r.en]), { ro:perm !== 'edit', bare:'min-w-[168px]' }) + '</td>' +
      '<td class="text-[12.5px] text-muted">' + esc(a.scope) + '</td>' +
      '<td class="rt num">' + a.n.toLocaleString() + '</td>' +
    '</tr>').join('');

  return setBlock('ทะเบียนผู้ใช้',
    'ค้นหาและกรองตามบริษัทและบทบาท · ปิดใช้งานบัญชีแทนการลบเสมอ เพื่อให้ประวัติ Ticket ยังอ้างอิงผู้แจ้งได้',
    '<div class="flex flex-col gap-3">' +
      '<div class="relative max-w-[420px]">' +
        '<span class="absolute left-3 top-1/2 -translate-y-1/2 text-faint pointer-events-none">' + ic('search', 'w-4 h-4') + '</span>' +
        '<input data-act="setq" data-k="uq" data-fkey="setuq" value="' + esc(S.set.uq) + '" class="input input-search" ' +
          'placeholder="ค้นหาชื่อ อีเมล แผนก หรือ AD group" aria-label="ค้นหาผู้ใช้">' +
      '</div>' +
      '<div><div class="eyebrow mb-1.5">บริษัท</div><div class="chiprow">' + coChips + '</div></div>' +
      '<div><div class="eyebrow mb-1.5">บทบาท</div><div class="chiprow">' + roleChips + '</div></div>' +
    '</div>' +
    '<div class="tbl-wrap mt-4"><table class="tbl tbl-tight tbl-sticky"><thead><tr>' +
      '<th class="min-w-[180px]">ชื่อ / อีเมล</th><th>บริษัท / แผนก</th><th class="min-w-[146px]">บทบาท</th>' +
      '<th>AD group</th><th>สถานะ / เข้าใช้ล่าสุด</th><th>จัดการ</th>' +
    '</tr></thead><tbody>' + (rows || '<tr><td colspan="6" class="text-center text-faint py-6">ไม่พบผู้ใช้ที่ตรงกับเงื่อนไข</td></tr>') + '</tbody></table></div>' + tblHint() +
    '<div class="mt-4 flex flex-wrap items-center gap-3">' +
      addBtn('user', '', 'เพิ่มผู้ใช้', perm !== 'edit') +
      '<span class="text-[11.5px] text-faint">แสดง ' + list.length + ' จาก ' + d.list.length + ' บัญชี</span>' +
    '</div>')
  + setBlock('แมป AD security group → บทบาท',
    'ผู้ใช้ได้สิทธิ์อัตโนมัติจาก security group ตอนเข้าสู่ระบบผ่าน SSO — ไม่ต้องตั้งค่ารายคน เมื่อ HR ย้ายกลุ่มใน AD สิทธิ์จะตามไปเอง',
    '<div class="tbl-wrap"><table class="tbl tbl-tight"><thead><tr>' +
      '<th class="min-w-[230px]">AD security group</th><th class="min-w-[168px]">บทบาทในระบบ</th><th class="min-w-[200px]">ขอบเขตข้อมูล</th><th class="rt">สมาชิก</th>' +
    '</tr></thead><tbody>' + adRows + '</tbody></table></div>' + tblHint(true));
}

/* ─────────── 3. บทบาทและสิทธิ์ (RBAC) ─────────── */
function secRole(perm) {
  const d = viewOf('role');
  const ro = perm !== 'edit';
  let lastG = '';
  const rows = PERMS.map(p => {
    const head = p.g === lastG ? '' :
      '<tr><td colspan="' + (d.roles.length + 1) + '" class="bg-surface"><span class="eyebrow">' + esc(p.g) + '</span></td></tr>';
    lastG = p.g;
    return head + '<tr>' +
      '<td><div class="font-medium text-[12.5px] num">' + esc(p.k) + '</div>' +
        '<div class="text-[11.5px] text-faint leading-snug">' + esc(p.d) + '</div></td>' +
      d.roles.map(r =>
        '<td class="text-center">' +
          '<label class="check justify-center w-full"><input type="checkbox" data-act="setperm" ' +
            'data-r="' + r.k + '" data-p="' + esc(p.k) + '"' + (d.rbac[r.k] && d.rbac[r.k][p.k] ? ' checked' : '') + (ro ? ' disabled' : '') +
            ' aria-label="' + esc(r.label + ' — ' + p.k) + '"><i aria-hidden="true"></i></label>' +
        '</td>').join('') +
    '</tr>';
  }).join('');

  const roleCards = d.roles.map((r, i) =>
    '<div class="setcard flex items-start gap-3">' +
      '<div class="min-w-0 flex-1">' +
        '<div class="font-semibold text-[13.5px] leading-snug">' + esc(r.label) + '</div>' +
        '<div class="eyebrow mt-1">' + esc(r.en) + '</div>' +
        (r.note ? '<div class="text-[12.5px] text-muted leading-snug mt-1.5">' + esc(r.note) + '</div>' : '') +
        '<div class="text-[12.5px] text-faint mt-1 num">' + r.n.toLocaleString() + ' ผู้ใช้ถือบทบาทนี้</div>' +
      '</div>' +
      (r.sys
        ? '<span class="tag tag-quiet flex-none">' + ic('lock') + 'บทบาทระบบ</span>'
        : '<button data-act="askrole" data-i="' + i + '" class="btn btn-secondary btn-sm flex-none"' + (ro ? ' disabled' : '') + '>' +
            ic('trash', 'w-4 h-4') + 'ลบ</button>') +
    '</div>').join('');

  return setBlock('บทบาทในระบบ',
    'ระบบมีสามระดับตามที่ผู้บริหารกำหนดและลบไม่ได้ — ผู้ใช้งานทั่วไป · Team Helpdesk · Super Admin · ' +
    'สร้างบทบาทเพิ่มได้เมื่อต้องการชุดสิทธิ์เฉพาะกิจ เช่น ผู้ตรวจสอบภายใน',
    '<div class="setcards">' + roleCards + '</div>' +
    '<div class="mt-4 flex flex-wrap items-center gap-3">' +
      '<button data-act="setadd" data-sec="role" class="btn btn-secondary btn-sm"' + (ro ? ' disabled' : '') + '>' +
        ic('plus', 'w-4 h-4') + 'สร้างบทบาทใหม่</button>' +
      '<span class="text-[11.5px] text-faint">การลบบทบาทต้องยืนยันก่อน เพราะผู้ใช้ที่ถืออยู่จะถูกลดสิทธิ์ทันที</span>' +
    '</div>')
  + setBlock('เมทริกซ์สิทธิ์ (role × permission)',
    'ติ๊กเพื่อเปิด/ปิดสิทธิ์รายข้อ · Team Helpdesk ได้สิทธิ์กลุ่ม "งานประจำวันกับ Ticket" และ "เปิดดูข้อมูลระบบ" ครบทุกข้อ ' +
    'ส่วนกลุ่ม "แก้ไข / ลบข้อมูลระบบ" รวมถึง settings.manage สงวนไว้ให้ Super Admin เท่านั้น',
    '<div class="tbl-wrap"><table class="tbl tbl-tight tbl-sticky"><thead><tr>' +
      '<th class="min-w-[260px]">Permission</th>' +
      d.roles.map(r => '<th class="text-center whitespace-nowrap">' + esc(r.label) + '</th>').join('') +
    '</tr></thead><tbody>' + rows + '</tbody></table></div>' + tblHint(true));
}

/* ─────────── 4. หมวดหมู่และแบบฟอร์ม ─────────── */
function secCat(perm) {
  const d = viewOf('cat');
  const co = CATS[S.set.catco] ? S.set.catco : (activeCO()[0] || CO[0]).code;
  const list = d[co] || [];
  const ro = !rowEditable(perm);

  const tabs = CO.map(c =>
    '<button data-act="setpick" data-k="catco" data-v="' + c.code + '" class="chip" aria-pressed="' + (co === c.code ? 'true' : 'false') + '">' +
      esc(c.name) + '<span class="cn">' + ((d[c.code] || []).length) + '</span></button>').join('');

  const rows = list.map((x, i) =>
    '<tr>' +
      '<td class="num text-faint text-[12.5px]">' + String(i + 1).padStart(2, '0') + '</td>' +
      '<td>' + fIn('cat', co + '.' + i + '.n', 'ชื่อหมวด', x.n, { ro:ro, bare:'min-w-[210px]' }) + '</td>' +
      '<td class="text-center">' + swCell('cat', co + '.' + i + '.itam', x.itam, ro, 'บังคับรหัสทรัพย์สินของ ' + x.n) + '</td>' +
      '<td class="text-center">' + swCell('cat', co + '.' + i + '.gps', x.gps, ro, 'บังคับพิกัด GPS ของ ' + x.n) + '</td>' +
      '<td>' + fSel('cat', co + '.' + i + '.prio', 'ระดับ', x.prio, PRIOS.map(p => [p.key, p.key + ' · ' + p.th]), { ro:ro, bare:'w-[142px]' }) + '</td>' +
      '<td><div class="flex items-center gap-1.5">' +
        '<button data-act="setmove" data-sec="cat" data-path="' + co + '" data-i="' + i + '" data-dir="up" class="btn btn-secondary btn-sm" ' +
          'aria-label="เลื่อนขึ้น"' + (ro || i === 0 ? ' disabled' : '') + '>' + ic('up', 'w-4 h-4') + '</button>' +
        '<button data-act="setmove" data-sec="cat" data-path="' + co + '" data-i="' + i + '" data-dir="down" class="btn btn-secondary btn-sm" ' +
          'aria-label="เลื่อนลง"' + (ro || i === list.length - 1 ? ' disabled' : '') + '>' + ic('down', 'w-4 h-4') + '</button>' +
        delBtn('cat', '', i, x.n, ro) +
      '</div></td>' +
    '</tr>').join('');

  return setBlock('หมวดหมู่ปัญหาแยกตามบริษัท',
    'ลำดับในตารางคือลำดับที่ผู้แจ้งเห็นในฟอร์ม · เปิด "รหัสทรัพย์สิน" หรือ "พิกัด GPS" แล้วฟอร์มแจ้งเรื่องจะโผล่ฟิลด์นั้นให้กรอกอัตโนมัติ · ' +
    'ความเร่งด่วนเริ่มต้นจะถูกเลือกให้ทันทีเมื่อผู้แจ้งเลือกหมวดนี้',
    '<div class="chiprow mb-4">' + tabs + '</div>' +
    '<div class="tbl-wrap"><table class="tbl tbl-tight tbl-sticky"><thead><tr>' +
      '<th>ลำดับ</th><th class="min-w-[210px]">ชื่อหมวดหมู่</th><th class="text-center">บังคับรหัสทรัพย์สิน</th>' +
      '<th class="text-center">บังคับพิกัด GPS</th><th>ความเร่งด่วนเริ่มต้น</th><th>จัดลำดับ / ลบ</th>' +
    '</tr></thead><tbody>' + (rows || '<tr><td colspan="6" class="text-center text-faint py-6">บริษัทนี้ยังไม่มีหมวดหมู่</td></tr>') + '</tbody></table></div>' + tblHint(true) +
    '<div class="mt-4 flex flex-wrap items-center gap-3">' +
      addBtn('cat', '', 'เพิ่มหมวดหมู่ให้ ' + CONAME(co), ro) +
      '<span class="text-[11.5px] text-faint">' + CONAME(co) + ' มี ' + list.length + ' หมวด</span>' +
    '</div>');
}

/* ─────────── 5. SLA และเวลาทำการ ─────────── */
function secSla(perm) {
  const d = viewOf('sla');
  const ro = perm !== 'edit';

/* ─────────── 6. กฎการมอบหมาย (Routing) ─────────── */
function secRt(perm) {
  const d = viewOf('rt');
  const catNames = ['ทุกหมวดหมู่'].concat(
    Object.keys(CATS).reduce((a, k) => a.concat(CATS[k].map(x => x.n)), []).filter((v, i, a) => a.indexOf(v) === i));
  const teamNames = TEAMS.map(t => t.name).concat(['Central IT — Identity', 'Cosi IT + Vendor POS', 'ดันขึ้นหัวหน้าทีม + Central IT'])
    .filter((v, i, a) => a.indexOf(v) === i);

  /* ตัวสร้างเงื่อนไขมี 7 ฟิลด์ต่อกฎ — ถ้าทำเป็นตารางจะกว้างเกินแผงเสมอและปุ่มเปิด/ปิดจะหลุดออกนอกจอ
     จึงวางเป็นบล็อกต่อกฎ คั่นด้วยเส้นภายใน แล้วใช้ฟอร์มสามคอลัมน์บนจอกว้าง */
  const rows = d.list.map((r, i) => {
    const ro = !rowEditable(perm);
    return '<article class="rule-in pt-5 mt-5 first:border-t-0 first:pt-0 first:mt-0' + (r.on ? '' : ' opacity-60') + '">' +
      '<div class="flex flex-wrap items-center gap-x-3 gap-y-2 mb-3.5">' +
        '<span class="tag tag-outline num flex-none">กฎข้อ ' + String(i + 1).padStart(2, '0') + '</span>' +
        '<span class="text-[12.5px] text-muted leading-snug flex-1 min-w-[200px]">' +
          esc(condText(r)) + ' → ' + esc(r.team) + (r.on ? '' : ' · ปิดใช้อยู่') + '</span>' +
        '<div class="flex items-center gap-1.5 flex-none">' +
          swCell('rt', 'list.' + i + '.on', r.on, ro, (r.on ? 'ปิดใช้' : 'เปิดใช้') + 'กฎข้อ ' + (i + 1)) +
          '<button data-act="setmove" data-sec="rt" data-path="list" data-i="' + i + '" data-dir="up" class="btn btn-secondary btn-sm" ' +
            'title="เพิ่มลำดับความสำคัญ" aria-label="เพิ่มลำดับความสำคัญของกฎข้อ ' + (i + 1) + '"' +
            (ro || i === 0 ? ' disabled' : '') + '>' + ic('up', 'w-4 h-4') + '</button>' +
          '<button data-act="setmove" data-sec="rt" data-path="list" data-i="' + i + '" data-dir="down" class="btn btn-secondary btn-sm" ' +
            'title="ลดลำดับความสำคัญ" aria-label="ลดลำดับความสำคัญของกฎข้อ ' + (i + 1) + '"' +
            (ro || i === d.list.length - 1 ? ' disabled' : '') + '>' + ic('down', 'w-4 h-4') + '</button>' +
          delBtn('rt', '', i, 'กฎข้อ ' + (i + 1), ro) +
        '</div>' +
      '</div>' +
      '<div class="setgrid setgrid-3">' +
        fSel('rt', 'list.' + i + '.co', 'บริษัท', r.co, [['ALL', 'ทุกบริษัท']].concat(CO.map(c => [c.code, c.name])), { ro:ro }) +
        fIn('rt', 'list.' + i + '.dept', 'แผนก', r.dept, { ro:ro }) +
        fSel('rt', 'list.' + i + '.cat', 'หมวดหมู่', r.cat, catNames, { ro:ro }) +
        fSel('rt', 'list.' + i + '.urg', 'ความเร่งด่วนที่เข้าเงื่อนไข', r.urg, MATRIX.cols.concat(['ทุกระดับ']), { ro:ro }) +
        fSel('rt', 'list.' + i + '.team', 'ทีมผู้รับ', r.team, teamNames, { ro:ro }) +
        fSel('rt', 'list.' + i + '.mode', 'วิธีกระจายงาน', r.mode, ROUTE_MODES, { ro:ro }) +
        fSel('rt', 'list.' + i + '.prio', 'ระดับที่บังคับใช้', r.prio, PRIOS.map(p => [p.key, p.key + ' · ' + p.th]), { ro:ro }) +
      '</div>' +
    '</article>';
  }).join('');

  const escRows = ESCALATION.map(e =>
    '<tr>' +
      '<td><span class="tag ' + (e.kind === 'hier' ? 'tag-solid' : 'tag-outline') + '">' + esc(e.tier) + '</span></td>' +
      '<td class="font-medium min-w-[190px]">' + esc(e.who) + '</td>' +
      '<td class="text-[12.5px] text-muted leading-relaxed min-w-[300px]">' + esc(e.when) + '</td>' +
      '<td class="text-[12.5px] text-faint whitespace-nowrap">' + (e.kind === 'hier' ? 'Hierarchical' : 'Functional') + '</td>' +
    '</tr>').join('');

  return setBlock('กฎการมอบหมายอัตโนมัติ',
    'ระบบไล่กฎจากบนลงล่างและใช้กฎแรกที่ตรงเงื่อนไข — เลื่อนลำดับเพื่อเปลี่ยนความสำคัญ · ' +
    'ปิดกฎแล้วแผง Auto Routing ในฟอร์มแจ้งเรื่องจะตกไปใช้ทีมตั้งต้นของ Service Desk ทันทีที่กดบันทึก',
    rows +
    '<div class="mt-5 pt-5 rule-in flex flex-wrap items-center gap-3">' +
      addBtn('rt', '', 'เพิ่มกฎการมอบหมาย', perm !== 'edit') +
      '<span class="text-[11.5px] text-faint">เปิดใช้อยู่ ' + d.list.filter(r => r.on).length + ' จาก ' + d.list.length + ' กฎ</span>' +
    '</div>')

  + setBlock('กฎการยกระดับ (Escalation)',
    'อ้างอิง AIDC-IT-SLA-001 ข้อ 6 — Functional ไล่ตามระดับทีมสนับสนุน Hierarchical ยกระดับสู่ผู้บริหาร เงื่อนไขเหล่านี้กำหนดในเอกสารควบคุมและปรับได้เฉพาะเมื่อทบทวนเอกสาร',
    '<div class="tbl-wrap"><table class="tbl tbl-tight"><thead><tr>' +
      '<th>ระดับ</th><th class="min-w-[190px]">ผู้รับผิดชอบ</th><th class="min-w-[300px]">เงื่อนไขการยกระดับ</th><th>ประเภท</th>' +
    '</tr></thead><tbody>' + escRows + '</tbody></table></div>' + tblHint());
}
