# AIDC Helpdesk — nginx
#
# หัวใจของไฟล์นี้: frontend (/) และ backend (/api/v1) อยู่ "origin เดียวกัน"
# cookie ที่ FastAPI ตั้งจึงถูกแนบไปทั้งจากเบราว์เซอร์และจาก Server Component
# โดยไม่ต้องทำ CORS และไม่ต้องมี proxy ของ Next.js (ADR-002 D-01)

limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m   rate=240r/m;

upstream api_backend {
    server api:8000;
    keepalive 32;
}

upstream web_frontend {
    server web:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name helpdesk.aidc.local;
    location /healthz { return 200 "ok\n"; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name helpdesk.aidc.local;

    ssl_certificate     /etc/nginx/certs/helpdesk.crt;
    ssl_certificate_key /etc/nginx/certs/helpdesk.key;
    ssl_protocols       TLSv1.2 TLSv1.3;          # NFR-12
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # ไฟล์แนบ 20 MB x 5 ไฟล์ + overhead ของ multipart
    # ต้องไม่ตั้งที่ 25m ตามที่ ADR-001 เคยเขียน มิฉะนั้น nginx จะตัดที่ 413 ก่อนถึงแอป
    client_max_body_size 110m;
    client_body_timeout  120s;
    client_body_buffer_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml font/woff2;
    gzip_min_length 1024;

    # ── ล็อกอิน: จำกัดอัตราเข้มกว่าปกติ (NFR-17) ──
    location = /api/v1/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api_backend;
        include /etc/nginx/conf.d/proxy_common.inc;
    }

    # ── export ที่อาจใช้เวลานาน (sync <= 5,000 แถว) ──
    location ~ ^/api/v1/(tickets|reports)/.*export {
        proxy_pass http://api_backend;
        include /etc/nginx/conf.d/proxy_common.inc;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # ── API ทั่วไป ──
    location /api/ {
        limit_req zone=api_zone burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://api_backend;
        include /etc/nginx/conf.d/proxy_common.inc;
        proxy_read_timeout    90s;   # ยาวกว่า gunicorn timeout เล็กน้อย
        proxy_send_timeout    90s;
        proxy_connect_timeout 10s;
        proxy_request_buffering off; # อัปโหลดไฟล์ใหญ่ไม่ต้องพักที่ nginx ทั้งก้อน
    }

    # ── ไฟล์แนบ: เข้าถึงได้เฉพาะผ่าน X-Accel-Redirect จาก FastAPI เท่านั้น ──
    # location internal = เบราว์เซอร์เรียกตรงไม่ได้ ต้องผ่านการตรวจสิทธิ์ที่แอปก่อนเสมอ (NFR-16)
    location /protected/attachments/ {
        internal;
        alias /data/attachments/;
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location /protected/exports/ {
        internal;
        alias /data/exports/;
        add_header Content-Disposition "attachment" always;
    }

    # ── static ของ Next.js: hash อยู่ในชื่อไฟล์แล้ว cache ยาวได้ ──
    location /_next/static/ {
        proxy_pass http://web_frontend;
        include /etc/nginx/conf.d/proxy_common.inc;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── ที่เหลือส่งให้ Next.js ──
    location / {
        proxy_pass http://web_frontend;
        include /etc/nginx/conf.d/proxy_common.inc;
        proxy_read_timeout 60s;
    }

    location = /healthz { return 200 "ok\n"; }
}
