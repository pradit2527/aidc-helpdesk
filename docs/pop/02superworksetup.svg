<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 415" width="1280" height="415" role="img"><title>ลำดับการเรียก API ของ Super Work ตอนตั้งค่า</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a89f9b"/></marker><marker id="ahx" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b47a3"/></marker></defs><rect x="0" y="0" width="1280" height="415" fill="#ffffff" stroke="none" stroke-width="1"/><text x="20" y="32" font-family="Consolas, monospace" font-size="12" fill="#c3260d" font-weight="600">SUPER WORK — SETUP SEQUENCE</text><text x="20" y="56" font-family="Tahoma, sans-serif" font-size="20" fill="#191615" font-weight="bold">ค่าที่ต้องหาก่อน จึงจะยิง POST /tasks ได้</text><line x1="20" y1="72" x2="1260" y2="72" stroke="#191615" stroke-width="1.6"/><rect x="20" y="112" width="196" height="54" fill="#e5e7f5" stroke="#3b47a3" stroke-width="1.6"/><text x="118.0" y="134" font-family="Consolas, monospace" font-size="12" fill="#3b47a3" font-weight="600" text-anchor="middle">GET /meta</text><text x="118.0" y="152" font-family="Tahoma, sans-serif" font-size="10.5" fill="#4d4644" text-anchor="middle">ไม่ต้องใช้สิทธิ์</text><rect x="264" y="112" width="200" height="54" fill="#e5e7f5" stroke="#3b47a3" stroke-width="1.6"/><text x="364.0" y="134" font-family="Consolas, monospace" font-size="12" fill="#3b47a3" font-weight="600" text-anchor="middle">GET /projects</text><text x="364.0" y="152" font-family="Tahoma, sans-serif" font-size="10.5" fill="#4d4644" text-anchor="middle">TechOps</text><rect x="512" y="112" width="268" height="54" fill="#e5e7f5" stroke="#3b47a3" stroke-width="1.6"/><text x="646.0" y="134" font-family="Consolas, monospace" font-size="12" fill="#3b47a3" font-weight="600" text-anchor="middle">GET /projects/{id}/activities</text><text x="646.0" y="152" font-family="Tahoma, sans-serif" font-size="10.5" fill="#4d4644" text-anchor="middle">HelpDesk Support</text><rect x="828" y="112" width="216" height="54" fill="#e5e7f5" stroke="#3b47a3" stroke-width="1.6"/><text x="936.0" y="134" font-family="Consolas, monospace" font-size="12" fill="#3b47a3" font-weight="600" text-anchor="middle">GET /activities/{id}</text><text x="936.0" y="152" font-family="Tahoma, sans-serif" font-size="10.5" fill="#4d4644" text-anchor="middle">อ่าน cards[]</text><rect x="1092" y="112" width="168" height="54" fill="#e5e7f5" stroke="#3b47a3" stroke-width="1.6"/><text x="1176.0" y="134" font-family="Consolas, monospace" font-size="12" fill="#3b47a3" font-weight="600" text-anchor="middle">…/members</text><text x="1176.0" y="152" font-family="Tahoma, sans-serif" font-size="10.5" fill="#4d4644" text-anchor="middle">3 คน</text><line x1="216" y1="139" x2="260" y2="139" stroke="#3b47a3" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ahx)"/><line x1="464" y1="139" x2="508" y2="139" stroke="#3b47a3" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ahx)"/><text x="486" y="104" font-family="Consolas, monospace" font-size="10.5" fill="#4d4644" text-anchor="middle">projectId</text><line x1="780" y1="139" x2="824" y2="139" stroke="#3b47a3" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ahx)"/><text x="802" y="104" font-family="Consolas, monospace" font-size="10.5" fill="#4d4644" text-anchor="middle">activityId</text><line x1="1044" y1="139" x2="1088" y2="139" stroke="#3b47a3" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ahx)"/><line x1="646" y1="166" x2="646" y2="262" stroke="#3b47a3" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ahx)"/><line x1="936" y1="166" x2="936" y2="262" stroke="#3b47a3" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ahx)"/><line x1="1176" y1="166" x2="1176" y2="262" stroke="#3b47a3" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ahx)"/><rect x="512" y="270" width="748" height="78" fill="#faf8f7" stroke="#191615" stroke-width="1.6"/><text x="536" y="294" font-family="Tahoma, sans-serif" font-size="13" fill="#191615" font-weight="bold">ตั้งเป็นตัวแปรสภาพแวดล้อมบน Railway</text><text x="536" y="320" font-family="Consolas, monospace" font-size="10.5" fill="#4d4644">SUPERWORK_ACTIVITY_ID</text><text x="536" y="335" font-family="Consolas, monospace" font-size="10.5" fill="#837a77">e332265e-0d7f-46df-b4ea-…</text><text x="810" y="320" font-family="Consolas, monospace" font-size="10.5" fill="#4d4644">SUPERWORK_CARD_ID</text><text x="810" y="335" font-family="Consolas, monospace" font-size="10.5" fill="#837a77">d1bf078c-f543-4bbf-9228-…</text><text x="1064" y="320" font-family="Consolas, monospace" font-size="10.5" fill="#4d4644">SUPERWORK_MEMBER_IDS</text><text x="1064" y="335" font-family="Consolas, monospace" font-size="10.5" fill="#837a77">b4cbe1d0-1f33-…</text><text x="20" y="294" font-family="Tahoma, sans-serif" font-size="11" fill="#837a77">คีย์ทำงานในนามพนักงานจริงคนหนึ่ง</text><text x="20" y="311" font-family="Tahoma, sans-serif" font-size="11" fill="#837a77">ทำได้เท่าที่คนนั้นทำได้ในแอป</text><text x="20" y="328" font-family="Tahoma, sans-serif" font-size="11" fill="#837a77">ถ้าคนนั้นลาออก คีย์หยุดทำงานทันที</text><line x1="20" y1="372" x2="1260" y2="372" stroke="#d6d0cd" stroke-width="1"/><text x="20" y="394" font-family="Tahoma, sans-serif" font-size="11" fill="#837a77">เรียกครั้งเดียวตอนตั้งค่า ไม่ได้เรียกซ้ำตอนใช้งาน — ผลลัพธ์ของแต่ละขั้นเป็นข้อมูลนำเข้าของขั้นถัดไป</text></svg>