<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 945" width="1280" height="945" role="img"><title>เส้นทางของ ticket หนึ่งใบ จากปุ่มกดถึงบอร์ด Super Work</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a89f9b"/></marker><marker id="ahx" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b47a3"/></marker></defs><rect x="0" y="0" width="1280" height="945" fill="#ffffff" stroke="none" stroke-width="1"/><text x="22" y="34" font-family="Consolas, monospace" font-size="12" fill="#c3260d" font-weight="600">AIDC HELPDESK  ×  SUPER WORK</text><text x="22" y="58" font-family="Tahoma, sans-serif" font-size="21" fill="#191615" font-weight="bold">เส้นทางของ ticket หนึ่งใบ — จากปุ่มกด ถึงบอร์ด Super Work</text><line x1="22" y1="74" x2="1258" y2="74" stroke="#191615" stroke-width="1.6"/><rect x="648" y="578" width="616" height="278" fill="#e5e7f5" stroke="none" stroke-width="1" opacity="0.55"/><rect x="648" y="578" width="616" height="278" fill="none" stroke="#3b47a3" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/><text x="666" y="600" font-family="Tahoma, sans-serif" font-size="11.5" fill="#3b47a3" font-weight="bold">ไม่รอผลจาก Super Work</text><rect x="22" y="96" width="176" height="52" fill="#faf8f7" stroke="#191615" stroke-width="1.6"/><text x="110" y="120" font-family="Tahoma, sans-serif" font-size="13" fill="#191615" font-weight="bold" text-anchor="middle">เบราว์เซอร์</text><text x="110" y="136" font-family="Consolas, monospace" font-size="10" fill="#837a77" text-anchor="middle">ຜູ້ແຈ້ງ</text><line x1="110" y1="148" x2="110" y2="862" stroke="#d6d0cd" stroke-width="1"/><rect x="272" y="96" width="176" height="52" fill="#faf8f7" stroke="#191615" stroke-width="1.6"/><text x="360" y="120" font-family="Tahoma, sans-serif" font-size="13" fill="#191615" font-weight="bold" text-anchor="middle">Next.js 15</text><text x="360" y="136" font-family="Consolas, monospace" font-size="10" fill="#837a77" text-anchor="middle">Vercel</text><line x1="360" y1="148" x2="360" y2="862" stroke="#d6d0cd" stroke-width="1"/><rect x="552" y="96" width="176" height="52" fill="#faf8f7" stroke="#191615" stroke-width="1.6"/><text x="640" y="120" font-family="Tahoma, sans-serif" font-size="13" fill="#191615" font-weight="bold" text-anchor="middle">NestJS 11</text><text x="640" y="136" font-family="Consolas, monospace" font-size="10" fill="#837a77" text-anchor="middle">Railway</text><line x1="640" y1="148" x2="640" y2="862" stroke="#d6d0cd" stroke-width="1"/><rect x="812" y="96" width="176" height="52" fill="#e7e3e1" stroke="#a89f9b" stroke-width="1.2"/><text x="900" y="120" font-family="Tahoma, sans-serif" font-size="13" fill="#191615" font-weight="bold" text-anchor="middle">PostgreSQL</text><text x="900" y="136" font-family="Consolas, monospace" font-size="10" fill="#837a77" text-anchor="middle">Neon · ap-southeast-1</text><line x1="900" y1="148" x2="900" y2="862" stroke="#d6d0cd" stroke-width="1"/><rect x="1072" y="96" width="188" height="52" fill="#e5e7f5" stroke="#3b47a3" stroke-width="1.6"/><text x="1166" y="120" font-family="Tahoma, sans-serif" font-size="13" fill="#191615" font-weight="bold" text-anchor="middle">Super Work</text><text x="1166" y="136" font-family="Consolas, monospace" font-size="10" fill="#837a77" text-anchor="middle">Partner Workboard</text><line x1="1166" y1="148" x2="1166" y2="862" stroke="#3b47a3" stroke-width="1" stroke-dasharray="2 4"/><text x="26" y="202" font-family="Consolas, monospace" font-size="10" fill="#837a77" font-weight="600">01</text><text x="235" y="190" font-family="Tahoma, sans-serif" font-size="12" fill="#191615" font-weight="bold" text-anchor="middle">กดปุ่ม “ສົ່ງເລື່ອງແຈ້ງ”</text><text x="235" y="205" font-family="Consolas, monospace" font-size="10.5" fill="#4d4644" text-anchor="middle">ຟອມ /tickets/new</text><line x1="110" y1="214" x2="356" y2="214" stroke="#a89f9b" stroke-width="1.4" marker-end="url(#ah)"/><text x="26" y="274" font-family="Consolas, monospace" font-size="10" fill="#837a77" font-weight="600">02</text><text x="500" y="258" font-family="Consolas, monospace" font-size="12" fill="#191615" font-weight="600" text-anchor="middle">POST /api/v1/attachments</text><text x="500" y="273" font-family="Consolas, monospace" font-size="10.5" fill="#4d4644" text-anchor="middle">multipart files[] · X-CSRF-Token</text><text x="500" y="288" font-family="Tahoma, sans-serif" font-size="11" fill="#837a77" text-anchor="middle">ยิงเฉพาะเมื่อมีไฟล์แนบ · ตรวจชนิดจาก magic bytes</text><line x1="360" y1="297" x2="636" y2="297" stroke="#a89f9b" stroke-width="1.4" marker-end="url(#ah)"/><text x="500" y="334" font-family="Consolas, monospace" font-size="10.5" fill="#4d4644" text-anchor="middle">201 · [ { id, file_name, file_size } ]</text><line x1="640" y1="343" x2="364" y2="343" stroke="#a89f9b" stroke-width="1.4" marker-end="url(#ah)"/><text x="26" y="404" font-family="Consolas, monospace" font-size="10" fill="#837a77" font-weight="600">03</text><text x="500" y="388" font-family="Consolas, monospace" font-size="12" fill="#191615" font-weight="600" text-anchor="middle">POST /api/v1/tickets</text><text x="500" y="403" font-family="Consolas, monospace" font-size="10.5" fill="#4d4644" text-anchor="middle">ticket_type · subject · description</text><text x="500" y="417" font-family="Consolas, monospace" font-size="10.5" fill="#4d4644" text-anchor="middle">category_id · impact · urgency · channel</text><text x="500" y="431" font-family="Consolas, monospace" font-size="10.5" fill="#4d4644" text-anchor="middle">attachment_ids[] · X-CSRF-Token</text><line x1="360" y1="441" x2="636" y2="441" stroke="#a89f9b" stroke-width="1.4" marker-end="url(#ah)"/><text x="26" y="490" font-family="Consolas, monospace" font-size="10" fill="#837a77" font-weight="600">04</text><text x="770" y="474" font-family="Tahoma, sans-serif" font-size="12" fill="#191615" font-weight="bold" text-anchor="middle">อ่านค่า SLA แล้ว INSERT</text><text x="770" y="489" font-family="Consolas, monospace" font-size="10.5" fill="#4d4644" text-anchor="middle">sla_target · business_hours · holiday</text><line x1="640" y1="499" x2="896" y2="499" stroke="#a89f9b" stroke-width="1.4" marker-end="url(#ah)"/><rect x="468" y="514" width="344" height="26" fill="#f8e3de" stroke="#c3260d" stroke-width="1.2"/><text x="640" y="531" font-family="Tahoma, sans-serif" font-size="10.5" fill="#c3260d" font-weight="bold" text-anchor="middle">priority = f(impact × urgency) — ผู้แจ้งตั้งเองไม่ได้</text><text x="770" y="564" font-family="Consolas, monospace" font-size="10.5" fill="#4d4644" text-anchor="middle">id · ticket_no เช่น AIDC-HQ-202609-0006</text><line x1="900" y1="573" x2="644" y2="573" stroke="#a89f9b" stroke-width="1.4" marker-end="url(#ah)"/><text x="26" y="638" font-family="Consolas, monospace" font-size="10" fill="#837a77" font-weight="600">05</text><text x="920" y="624" font-family="Consolas, monospace" font-size="12" fill="#3b47a3" font-weight="600">POST /tasks</text><text x="920" y="639" font-family="Consolas, monospace" font-size="10.5" fill="#4d4644">activityId · cardId · members[]</text><text x="920" y="653" font-family="Consolas, monospace" font-size="10.5" fill="#4d4644">title = “{ticket_no} · {subject}”</text><text x="920" y="667" font-family="Consolas, monospace" font-size="10.5" fill="#4d4644">priorityStatus · description</text><text x="920" y="681" font-family="Consolas, monospace" font-size="10.5" fill="#4d4644">X-API-Key · X-Idempotency-Key</text><line x1="640" y1="691" x2="1162" y2="691" stroke="#3b47a3" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ahx)"/><text x="26" y="738" font-family="Consolas, monospace" font-size="10" fill="#837a77" font-weight="600">06</text><text x="500" y="724" font-family="Tahoma, sans-serif" font-size="12" fill="#191615" font-weight="bold" text-anchor="middle">201 · เรื่องแจ้งถูกบันทึกแล้ว</text><text x="500" y="739" font-family="Consolas, monospace" font-size="10.5" fill="#4d4644" text-anchor="middle">{ id, ticket_no, priority, sla{…} }</text><line x1="640" y1="749" x2="364" y2="749" stroke="#a89f9b" stroke-width="1.4" marker-end="url(#ah)"/><text x="26" y="792" font-family="Consolas, monospace" font-size="10" fill="#837a77" font-weight="600">07</text><text x="235" y="778" font-family="Tahoma, sans-serif" font-size="12" fill="#191615" font-weight="bold" text-anchor="middle">ไปหน้า /tickets/{id}</text><text x="235" y="793" font-family="Consolas, monospace" font-size="10.5" fill="#4d4644" text-anchor="middle">toast: ເລກທີ {ticket_no}</text><line x1="360" y1="803" x2="114" y2="803" stroke="#a89f9b" stroke-width="1.4" marker-end="url(#ah)"/><text x="920" y="774" font-family="Consolas, monospace" font-size="10.5" fill="#4d4644">201 · { task.id }</text><text x="920" y="788" font-family="Tahoma, sans-serif" font-size="10.5" fill="#4d4644">หรือ 200 + idempotentReplay</text><line x1="1166" y1="798" x2="644" y2="798" stroke="#3b47a3" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ahx)"/><text x="920" y="818" font-family="Tahoma, sans-serif" font-size="11" fill="#837a77">คำตอบมาถึงหลังผู้ใช้เห็นผลแล้ว</text><text x="920" y="833" font-family="Tahoma, sans-serif" font-size="11" fill="#837a77">เทียบค่าที่ส่งกับที่ได้ แล้วเขียน log</text><line x1="22" y1="882" x2="1258" y2="882" stroke="#d6d0cd" stroke-width="1"/><text x="22" y="904" font-family="Tahoma, sans-serif" font-size="11" fill="#837a77">ทุกคำขอที่เปลี่ยนข้อมูลต้องมี X-CSRF-Token ให้ตรงกับคุกกี้ aidc_csrf · ยืนยันตัวตนด้วยคุกกี้ httpOnly (aidc_at, aidc_rt) ไม่ใช่ Bearer token</text><text x="22" y="921" font-family="Tahoma, sans-serif" font-size="11" fill="#837a77">เส้นทึบ = คำขอภายในระบบเรา รอคำตอบ   ·   เส้นประน้ำเงิน = คำขอออกไป Super Work ไม่รอคำตอบ</text></svg>